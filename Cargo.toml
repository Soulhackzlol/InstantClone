[package]
name = "instantclone"
version = "0.1.13"
edition = "2021"
authors = ["s1moscs"]
license = "GPL-3.0-only"
description = "Free open-source RTMP delay proxy for Windows streamers. Two-phase arm/activate, IDR-aligned cuts, multi-destination egress, Twitch Enhanced Broadcasting + VOD audio, OBS-native dock and overlay."
repository = "https://github.com/Soulhackzlol/InstantClone"
homepage = "https://s1moscs.dev/instantclone"
readme = "README.md"
keywords = ["rtmp", "obs", "twitch", "streaming", "delay"]
categories = ["multimedia::video", "command-line-utilities"]

# Squeeze every byte out of the release binary. opt-level = "s" trades
# a small amount of code-generation aggressiveness for a meaningful
# binary-size win - measured at -236 KB (1404 KB -> 1168 KB) vs
# opt-level = 3 on our workload. Hot paths in this binary are
# I/O-bound (RTMP chunk read/write, disk ring append, TCP send) where
# the bottleneck is the syscall, not codegen, so the size win is the
# right tradeoff for end-users.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt", "net", "io-util", "sync", "time", "macros", "fs", "signal", "process",
] }
bytes = "1"

# Tiny blocking HTTPS client for the Discord webhook. `native-tls` uses
# the Windows schannel that's already in the process, so we don't ship
# rustls + ring (which would add ~1.4 MB to the binary for one POST).
# Default features off so we don't pull gzip / json / cookies we don't use.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

# Async TLS for RTMPS egress (Kick and any rtmps:// destination). Wraps
# the SAME `native-tls`/schannel already linked above, so it reuses the
# Windows TLS stack already in the process instead of pulling a second
# one (rustls + ring would add ~1.4 MB - the exact cost the ureq note
# above avoids). Only the thin async adapter is new.
tokio-native-tls = "0.3"

# Windows-only: system-tray icon + opening the default browser via a real
# shell call. Same `windows-sys` crate that tokio's `mio` already pulls in
# transitively, so adding it explicitly costs ~0 binary bytes - we just
# get to use the typed APIs instead of hand-rolling FFI blocks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

# Unix-only: `statvfs` for the free-space query and `/proc` sampling for the
# dashboard metric grid. Windows uses its own kernel32 FFI for the same,
# declared inline. Directly used by config.rs / sysstat.rs, so it's declared
# here rather than leaned on transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Build-time only: minify + gzip the dashboard HTML so the binary embeds
# only the compressed bytes. Does NOT add to the release binary.
[build-dependencies]
flate2 = "1"
