<!doctype html>
<!--
  InstantClone overlay — "strip".

  A 2 px line at the very bottom of the frame. The line's WIDTH is the
  buffer fill (0 → armed), its COLOUR is the state:
    transparent = idle (line is invisible)
    amber       = buffering
    cyan-glow   = active / ready
    red         = egress dropped while ingest is up
  The delay number rides on the far right of the line, small and
  understated, only visible once the buffer starts filling.
-->
<html><head><meta charset="utf-8"><title>Delay (strip)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;width:100%;height:100%;
  font-family:'Inter','SF Pro Display',-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.bar{position:fixed;left:0;right:0;bottom:0;height:36px;
  display:flex;align-items:flex-end;
  color:rgba(255,255,255,.7);
  pointer-events:none}
.track{position:absolute;left:0;right:0;bottom:0;height:2px;
  background:rgba(255,255,255,.04)}
.fill{position:absolute;left:0;bottom:0;height:2px;width:0;
  background:currentColor;
  box-shadow:0 0 12px currentColor,0 -2px 18px currentColor;
  transition:width .42s cubic-bezier(.16,1,.3,1),background-color .35s ease,opacity .35s ease;
  opacity:0}
.bar.show .fill{opacity:1}
.bar.idle{color:rgba(255,255,255,.5)}
.bar.amber{color:#ffb73a}
.bar.ok{color:#5ac8fa}
.bar.red{color:#ff5a5a}
/* When live, the trailing edge of the line gently breathes so the
   streamer notices the delay is engaged. */
.bar.live .fill{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 12px currentColor,0 -2px 18px currentColor}
  50%{box-shadow:0 0 22px currentColor,0 -2px 28px currentColor}}
.label{position:absolute;right:18px;bottom:10px;
  display:flex;align-items:baseline;gap:4px;
  font-variant-numeric:tabular-nums;
  color:currentColor;
  opacity:0;
  transform:translateY(4px);
  transition:opacity .42s ease,transform .42s ease}
.bar.show .label{opacity:1;transform:none}
.v{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1;
  text-shadow:0 0 12px currentColor}
.u{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  opacity:.7}
</style></head><body>
<div class="bar idle" id="w">
  <div class="track"></div>
  <div class="fill" id="fill"></div>
  <div class="label"><span class="v" id="v">0.0</span><span class="u">s</span></div>
</div>
<script>
'use strict';
const w = document.getElementById('w');
const fillEl = document.getElementById('fill');
const vEl = document.getElementById('v');

let tween = {raf:0};
function tweenTo(secs){
  const from = parseFloat(vEl.textContent) || 0;
  if (Math.abs(secs - from) < 0.05){ vEl.textContent = secs.toFixed(1); return; }
  cancelAnimationFrame(tween.raf);
  const start = performance.now(), dur = 400;
  function step(now){
    const t = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    vEl.textContent = (from + (secs - from) * e).toFixed(1);
    if (t < 1) tween.raf = requestAnimationFrame(step);
  }
  tween.raf = requestAnimationFrame(step);
}

function paint(s){
  w.classList.remove('idle','ok','amber','red','live','show');
  let displayMs = 0, fillFrac = 0, show = false;
  if (!s.ingest_alive || s.phase === 'idle'){
    w.classList.add('idle');
  } else if (s.phase === 'preparing'){
    w.classList.add('amber','show');
    show = true;
    displayMs = s.buffer_fill_ms || 0;
    fillFrac = Math.max(0, Math.min(1, displayMs / (s.armed_delay_ms || 1)));
  } else if (s.phase === 'ready'){
    w.classList.add('ok','show'); show = true;
    displayMs = s.armed_delay_ms || 0;
    fillFrac = 1;
  } else {
    w.classList.add('ok','live','show'); show = true;
    displayMs = s.target_delay_ms || s.armed_delay_ms || s.current_delay_ms || 0;
    fillFrac = 1;
  }
  if (s.ingest_alive && s.destinations_total > 0 && s.destinations_alive === 0){
    w.classList.remove('idle','ok','amber');
    w.classList.add('red','show');
    fillFrac = 1;
  }
  fillEl.style.width = (fillFrac * 100).toFixed(2) + '%';
  tweenTo(displayMs / 1000);
}

function start(){
  if (window.EventSource){
    try {
      const es = new EventSource('/events');
      es.onmessage = e => { try { paint(JSON.parse(e.data)); } catch(_){} };
      es.onerror = () => { es.close(); setTimeout(startPolling, 1000); };
      return;
    } catch(_){}
  }
  startPolling();
}
function startPolling(){
  async function tick(){ try { paint(await (await fetch('/state')).json()); } catch(_){} }
  tick(); setInterval(tick, 500);
}
start();
</script></body></html>
