<!doctype html>
<!--
  InstantClone overlay — "minimal".

  Top-left whisper. The whole thing is the delay number + a colour cue.
  No "OBS"/"LIVE" text labels — state is encoded in the number's tint and
  glow:
    grey      = ingest disconnected (or idle/passthrough)
    amber     = buffer is filling toward the armed delay
    cyan      = armed, waiting for activate
    cyan-lit  = delay is live (subtle breathing pulse)
    red       = egress dropped while ingest is still publishing
  The number itself tweens between values so arming reads as a build-up.
-->
<html><head><meta charset="utf-8"><title>Delay (minimal)</title>
<style>
:root{
  --grey:rgba(255,255,255,.55);
  --amber:#ffb73a;
  --cyan:#5ac8fa;
  --red:#ff5a5a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;width:100%;height:100%;
  font-family:'Inter','SF Pro Display',-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.wrap{position:fixed;left:24px;top:24px;
  display:flex;align-items:baseline;gap:6px;
  color:var(--grey);
  /* state colour comes in via the --c variable; transition is what makes
     it READ as a smooth state change rather than a snap. */
  transition:color .55s ease,opacity .55s ease,filter .55s ease;
  animation:enter .5s cubic-bezier(.16,1,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(-4px) scale(.98)}
  to{opacity:1;transform:none}}
.wrap.idle{opacity:.32;filter:blur(.3px)}
.wrap.ok{color:var(--cyan)}
.wrap.amber{color:var(--amber)}
.wrap.red{color:var(--red)}
/* Active (delay live) breathes very gently to signal "the clock is
   running on a delayed feed" without strobing the viewer. */
.wrap.live .v{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{text-shadow:0 0 18px currentColor}
  50%{text-shadow:0 0 28px currentColor}}
.v{font-size:38px;font-weight:700;letter-spacing:-1.5px;line-height:1;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 18px currentColor;
  transition:text-shadow .35s ease}
.u{font-size:18px;font-weight:500;opacity:.7;letter-spacing:-.2px}
</style></head><body>
<div class="wrap idle" id="w"><span class="v" id="v">0.0</span><span class="u">s</span></div>
<script>
'use strict';
const w = document.getElementById('w');
const vEl = document.getElementById('v');

// Tween the number between values with an ease-out so a phase change
// reads as a smooth ramp instead of a snap. 400 ms hits a sweet spot
// between "I see it move" and "it's already settled".
let tween = {raf:0, target:0};
function tweenTo(secs){
  const from = parseFloat(vEl.textContent) || 0;
  if (Math.abs(secs - from) < 0.05){ vEl.textContent = secs.toFixed(1); tween.target = secs; return; }
  cancelAnimationFrame(tween.raf);
  const start = performance.now(), dur = 400;
  tween.target = secs;
  function step(now){
    const t = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    vEl.textContent = (from + (secs - from) * e).toFixed(1);
    if (t < 1) tween.raf = requestAnimationFrame(step);
  }
  tween.raf = requestAnimationFrame(step);
}

// Translate /state into one of five visual states. The "ok" class is
// the default-armed colour (cyan); "live" adds the breathing pulse on
// top of whatever colour class is set.
function paint(s){
  w.classList.remove('idle','ok','amber','red','live');
  let displayMs = 0;
  if (!s.ingest_alive){
    w.classList.add('idle');
  } else if (s.phase === 'idle'){
    w.classList.add('idle'); // passthrough — show 0.0s, dimmed
  } else if (s.phase === 'preparing'){
    w.classList.add('amber');
    displayMs = s.buffer_fill_ms || 0;
  } else if (s.phase === 'ready'){
    w.classList.add('ok');
    displayMs = s.armed_delay_ms || 0;
  } else { // active
    w.classList.add('ok','live');
    displayMs = s.target_delay_ms || s.armed_delay_ms || s.current_delay_ms || 0;
  }
  // Egress failure trumps the phase colour — the streamer needs to
  // notice the dropped destination immediately, viewer or not.
  if (s.ingest_alive && s.destinations_total > 0 && s.destinations_alive === 0){
    w.classList.remove('idle','ok','amber'); w.classList.add('red');
  }
  tweenTo(displayMs / 1000);
}

// Prefer SSE — single long-lived socket, server pushes on change. Fall
// back to polling for environments where EventSource isn't available
// (older OBS CEF builds, network proxies that buffer text/event-stream).
function start(){
  if (window.EventSource){
    try {
      const es = new EventSource('/events');
      es.onmessage = e => { try { paint(JSON.parse(e.data)); } catch(_){} };
      es.onerror = () => { es.close(); setTimeout(startPolling, 1000); };
      return;
    } catch(_){}
  }
  startPolling();
}
function startPolling(){
  async function tick(){ try { paint(await (await fetch('/state')).json()); } catch(_){} }
  tick(); setInterval(tick, 500);
}
start();
</script></body></html>
