<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>InstantClone</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* The dashboard's design tokens, so the dock reads as the same product.
   --panel / --panel-2 are the dock's two surfaces (rows, and the inset
   number screen); the accent pair is overridden per dock (applyCfg). */
:root{
  --bg:#07080a;--bg-2:#0c0e12;--surface:#11141a;--surface-2:#171b22;--surface-3:#1f242d;
  --panel:var(--surface-2);--panel-2:var(--bg-2);
  --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.18);--hl:rgba(255,255,255,.06);
  --fg:oklch(0.97 0.005 230);--fg-2:oklch(0.80 0.012 230);--fg-3:oklch(0.62 0.015 230);--fg-4:oklch(0.50 0.018 230);
  --accent:#5ac8fa;--accent-ink:#04121c;
  --live:oklch(0.78 0.18 145);--warn:oklch(0.80 0.17 65);--danger:oklch(0.72 0.21 25);
  --ease-out:cubic-bezier(.2,.7,.2,1);--ease-sheet:cubic-bezier(.32,.72,0,1);
  --r:10px;--r-sm:8px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;
  overflow-x:hidden;overflow-y:auto;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font-family:inherit}
body::-webkit-scrollbar{width:6px}
body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px}
.wrap{display:flex;flex-direction:column;min-height:100vh;padding:10px;gap:8px}
.top,.screen,.cta-row{flex:0 0 auto}
/* Any widget can be switched off from the gear editor. */
[hidden]{display:none!important}

/* The right end stays clear for the gear, which fades in over this corner. */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px;padding-right:26px}

/* Phase chip */
.phase{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--line);
  background:var(--panel);color:var(--fg-3);white-space:nowrap;overflow:hidden;
  transition:color .25s var(--ease-out),background-color .25s var(--ease-out),border-color .25s var(--ease-out),box-shadow .25s var(--ease-out)}
/* The word is its own box so it can rise in while the chip glides to its width. */
.phase>span{display:inline-block}
.phase.live  {color:var(--live);  border-color:color-mix(in oklch,var(--live) 38%,transparent);  background:color-mix(in oklch,var(--live) 10%,var(--panel))}
.phase.arming{color:var(--warn);  border-color:color-mix(in oklch,var(--warn) 38%,transparent);  background:color-mix(in oklch,var(--warn) 10%,var(--panel))}
.phase.armed {color:var(--accent);border-color:color-mix(in oklch,var(--accent) 38%,transparent);background:color-mix(in oklch,var(--accent) 10%,var(--panel))}
.phase.active{color:var(--live);  border-color:color-mix(in oklch,var(--live) 50%,transparent);  background:color-mix(in oklch,var(--live) 15%,var(--panel));box-shadow:0 0 14px -4px color-mix(in oklch,var(--live) 55%,transparent)}
.phase.holding{color:var(--warn); border-color:color-mix(in oklch,var(--warn) 55%,transparent);  background:color-mix(in oklch,var(--warn) 13%,var(--panel))}

/* Signal pill */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg-3);
  transition:color .2s var(--ease-out),border-color .2s var(--ease-out)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--fg-4);
  transition:background-color .2s,box-shadow .2s}
.pill.on{color:var(--fg)}
/* Gentle breathing on the live dot - the dock reads "alive" at a glance. */
.pill.on .dot{background:var(--live);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 3px color-mix(in oklch,var(--live) 18%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in oklch,var(--live) 6%,transparent)}}
.pill.bad .dot{background:var(--fg-4)}
/* Live-as-dot mode: collapse the pill to just its signal dot. */
.pill.asdot{padding:5px;gap:0}
.pill.asdot #src-lbl{display:none}
.pill.asdot .dot{width:8px;height:8px}

/* Quiet one-line notice: a stream setting a destination won't take
   (amber), or a dock link the dashboard password turns away (red). */
.note{display:flex;align-items:flex-start;gap:8px;padding:7px 8px 7px 10px;border-radius:var(--r);
  border:1px solid color-mix(in oklch,var(--warn) 30%,transparent);
  background:color-mix(in oklch,var(--warn) 7%,var(--panel-2));font-size:11px;line-height:1.4;color:var(--fg-2);
  animation:rise .24s var(--ease-out)}
.note .note-ic{flex:none;color:var(--warn);font-weight:800;line-height:1.4}
.note .note-text{flex:1;min-width:0;text-wrap:pretty}
.note .note-x{flex:none;width:20px;height:20px;margin:-2px -2px 0 0;border-radius:6px;border:0;background:transparent;
  color:var(--fg-4);font-size:14px;line-height:1;cursor:pointer;position:relative;
  transition:color .15s var(--ease-out),background-color .15s var(--ease-out)}
.note .note-x::before{content:"";position:absolute;inset:-5px}
.note .note-x:hover{color:var(--fg);background:var(--surface-3)}
.note.bad{border-color:color-mix(in oklch,var(--danger) 35%,transparent);background:color-mix(in oklch,var(--danger) 8%,var(--panel-2))}
.note.bad .note-ic{color:var(--danger)}

/* Big delay readout / setter inside an inset "screen" */
.screen{background:linear-gradient(180deg,var(--bg-2),color-mix(in oklch,var(--bg-2) 60%,#000));
  border:1px solid var(--line);border-top-color:rgba(255,255,255,.11);
  border-radius:12px;padding:10px 11px 11px;position:relative;
  box-shadow:inset 0 1px 0 var(--hl);transition:border-color .2s var(--ease-out),box-shadow .2s var(--ease-out)}
/* Picking a new delay while one runs: an accent rim says "not applied yet". */
.screen.editing{border-color:color-mix(in oklch,var(--accent) 45%,transparent);
  box-shadow:inset 0 1px 0 var(--hl),0 0 0 3px color-mix(in oklch,var(--accent) 12%,transparent)}
/* The caption takes the buffer bar's 13px while picking, so nothing moves. */
.edit-cap{display:block;height:13px;padding-top:4px;font-size:9.5px;line-height:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edit-cap-num{text-transform:none}
.screen.editing .bar{display:none}
.num-row{display:flex;align-items:center;justify-content:center;gap:8px}
.cur{font-size:clamp(24px,11vw,34px);font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1.1;
  transition:color .25s var(--ease-out),transform .25s var(--ease-sheet);
  display:inline-flex;align-items:baseline;justify-content:center;min-width:2.4em}
/* The idle setter shares the readout's exact type so nothing jumps when the
   dock crosses from passthrough into an armed delay. It is sized to its
   digits (fitDelayInput) so the unit sits right after them, while the
   fixed-width .cur keeps the +/- buttons from moving under the cursor. */
.cur input{font:inherit;letter-spacing:inherit;color:inherit;background:transparent;border:0;
  outline:none;text-align:center;width:1ch;padding:0;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;border-radius:6px}
.cur input:focus-visible{box-shadow:0 2px 0 color-mix(in oklch,var(--accent) 70%,transparent)}
.cur input::-webkit-outer-spin-button,.cur input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cur .u{font-size:.4em;color:var(--fg-3);font-weight:600;margin-left:2px;letter-spacing:0}
/* Rolling digits (rollDigits): changed digits roll in their own columns.
   While the field rolls, the roll stands in for it at the same size. */
.cur{--dg-w:calc(1ch - .04em)}
.dg{display:inline-block;width:var(--dg-w);height:1.15em;overflow:hidden;vertical-align:bottom;text-align:center}
.dg-strip{display:flex;flex-direction:column}
.dg-strip>span{height:1.15em;line-height:1.15em}
#v,.roll{font-variant-numeric:tabular-nums}
.cur .roll{display:none}
.cur.d-rolling .roll{display:inline}
.cur.d-rolling input{position:absolute;opacity:0;pointer-events:none}
.cur.changing{color:var(--accent);transform:scale(1.04)}
/* Accent-tinted readout: the number always wears the dock's accent hue. */
.cur.tint{color:var(--accent)}
/* Less delay on air than was armed: amber, whatever the tint. */
.cur.short,.cur.short.tint{color:var(--warn)}
/* An engaged readout opens for a new value on tap. */
.cur.tap #v{cursor:pointer;border-radius:6px;transition:color .15s var(--ease-out)}
.cur.tap #v:hover{color:color-mix(in oklch,var(--accent) 70%,var(--fg))}
/* Number size modes */
.sz-sm .cur{font-size:clamp(18px,7vw,24px)}
.sz-lg .cur{font-size:clamp(30px,14vw,48px)}
/* Round nudge buttons that flank the number. */
.np{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  background:var(--surface-3);color:var(--fg-2);font-size:17px;line-height:1;cursor:pointer;position:relative;
  transition:border-color .15s var(--ease-out),background-color .15s var(--ease-out),color .15s var(--ease-out),opacity .15s,
    transform .15s var(--ease-sheet)}
.np::before{content:"";position:absolute;inset:-5px}
.np:hover:not(:disabled){border-color:var(--line-2);color:var(--fg);
  background:color-mix(in oklch,var(--accent) 8%,var(--surface-3))}
.np:active:not(:disabled){transform:scale(.94)}
.np:disabled{opacity:.3;cursor:default;pointer-events:none}
.bar{position:relative;height:4px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:9px}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--warn),color-mix(in oklch,var(--warn) 60%,#fff));
  transition:width .35s var(--ease-sheet)}
.bar .fill.ready {background:linear-gradient(90deg,var(--accent),color-mix(in oklch,var(--accent) 55%,#fff))}
.bar .fill.active{background:linear-gradient(90deg,var(--live),color-mix(in oklch,var(--live) 55%,#fff))}
.bar .pct{position:absolute;right:0;top:-14px;font-size:9.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.bar.thick{height:8px}
/* Accent-only bar: one hue through fill/ready/active instead of the
   amber -> cyan -> green state ramp - for single-color themed docks. */
.bar.mono .fill,.bar.mono .fill.ready,.bar.mono .fill.active{
  background:linear-gradient(90deg,var(--accent),color-mix(in oklch,var(--accent) 55%,#fff))}

/* Egress glance (destinations + bitrate) */
.eg{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:var(--fg-3);
  font-variant-numeric:tabular-nums}
.eg b{color:var(--fg-2);font-weight:600}
.eg .sep{color:var(--fg-4)}

/* Crash protection hold: why, how long is left, who is on the reconnect
   screen, and End now (two-step). It takes the place of the delay controls
   (see applyCfg), which don't apply while OBS is gone. */
.hold{display:flex;flex-direction:column;gap:7px;padding:10px 11px;border-radius:12px;
  border:1px solid color-mix(in oklch,var(--warn) 50%,transparent);
  background:color-mix(in oklch,var(--warn) 8%,var(--panel-2))}
.hold-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hold-why{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.hold-why::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.hold-clock{font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hold-sub{font-size:11px;color:var(--fg-2)}
.hold .hold-end{padding:8px;font-size:12px;color:var(--danger);background:transparent;
  border-color:color-mix(in oklch,var(--danger) 45%,transparent)}
.hold .hold-end.armed,.hold .hold-end.armed:hover:not(:disabled){background:var(--danger);color:#fff;border-color:transparent}

/* Sub-tip with crossfade */
.tip{font-size:11px;color:var(--fg-3);text-align:center;min-height:0;line-height:1.35;text-wrap:balance;
  transition:opacity .15s var(--ease-out),transform .15s var(--ease-out)}
.tip.fade{opacity:0;transform:translateY(2px)}

/* Shared row look: destinations, switches, overlays, profile rows. */
.dest,.brow,.orow,.prow{border:1px solid var(--line);border-top-color:rgba(255,255,255,.11);border-radius:var(--r);
  background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:inset 0 1px 0 var(--hl)}

/* Destination quick-toggle strip */
.dests{display:flex;flex-direction:column;gap:5px}
.dest{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:12px}
.dest .d-dot{width:7px;height:7px;border-radius:50%;background:var(--fg-4);flex:0 0 auto;
  transition:background-color .2s,box-shadow .2s}
.dest.alive .d-dot{background:var(--live);box-shadow:0 0 0 3px color-mix(in oklch,var(--live) 18%,transparent)}
.dest .d-name{flex:1;min-width:0;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest.off .d-name{color:var(--fg-3)}
.dest .d-plat{color:var(--fg-3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.dest .d-rate{color:var(--live);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
/* Platform-coded rows: label, live dot, and the on-switch take the brand hue
   ("the little buttons colored" feedback). */
.dest.pc .d-plat{color:color-mix(in srgb,var(--pc) 80%,var(--fg-3))}
.dest.pc.alive .d-dot{background:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 20%,transparent)}
.dest.pc .sw.on{background:var(--pc)}
/* On but not streaming yet (connecting, or waiting for the delay), and
   on the crash-protection reconnect screen: amber, so a failing platform
   never looks like one that is simply off. */
.dest.wait .d-dot,.dest.held .d-dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in oklch,var(--warn) 18%,transparent)}
.dest.wait .d-dot{animation:blink 1.2s ease-in-out infinite}
.dest.wait .d-plat,.dest.held .d-plat{color:var(--warn)}
/* iOS-style switch */
.sw{width:34px;height:20px;flex:0 0 auto;border-radius:999px;border:0;background:var(--surface-3);
  box-shadow:inset 0 0 0 1px var(--line-2);
  position:relative;cursor:pointer;transition:background-color .2s var(--ease-sheet),box-shadow .2s var(--ease-sheet),opacity .15s}
/* Invisible halo so the small switch is comfortable to hit. */
.sw::before{content:"";position:absolute;inset:-6px -5px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .2s var(--ease-sheet)}
.sw:active::after{transform:scale(.92)}
.sw.on:active::after{transform:translateX(14px) scale(.92)}
.sw.on{background:var(--live);box-shadow:none}
.sw.on::after{transform:translateX(14px)}
.sw:disabled{opacity:.45;cursor:default}
/* Misclick guard: the row swaps to a Sure? / cancel pair for ~3s. */
.dest .confirm{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.dest .confirm .q{color:var(--warn);font-weight:700;font-size:10.5px}
.dest .cbtn{width:24px;height:22px;border-radius:6px;border:1px solid var(--line-2);
  background:var(--panel-2);cursor:pointer;font-size:12px;line-height:1;color:var(--fg-2);
  position:relative;transition:transform .12s var(--ease-sheet)}
.dest .cbtn::before{content:"";position:absolute;inset:-5px}
.dest .cbtn.yes{color:var(--live);border-color:color-mix(in oklch,var(--live) 45%,var(--line-2))}
.dest .cbtn.no{color:var(--fg-3)}
.dest .cbtn:active{transform:scale(.96)}
.empty{font-size:11px;color:var(--fg-3);text-align:center;padding:6px;line-height:1.4}
/* Icons layout: destinations as compact circular badges (hover for name). */
.dests.icons{flex-direction:row;flex-wrap:wrap;gap:7px;justify-content:center}
.dico{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--fg-3);
  cursor:pointer;transition:transform .12s var(--ease-sheet),border-color .15s,color .15s,box-shadow .2s,opacity .15s}
.dico:hover{border-color:var(--line-2);color:var(--fg);transform:translateY(-1px)}
.dico:active{transform:scale(.94)}
.dico.on{color:var(--fg);border-color:var(--line-2)}
.dico.off{opacity:.4}
.dico.alive{border-color:color-mix(in oklch,var(--live) 55%,transparent);box-shadow:0 0 0 3px color-mix(in oklch,var(--live) 16%,transparent)}
/* Platform-coded badges (--pc set per element): letter + ring take the
   platform's brand hue so a glance says WHICH service is live. */
.dico.pc{color:color-mix(in srgb,var(--pc) 75%,var(--fg-3))}
.dico.pc.on{color:var(--pc);border-color:color-mix(in srgb,var(--pc) 50%,var(--line))}
.dico.pc.alive{border-color:color-mix(in srgb,var(--pc) 70%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 20%,transparent)}
.dico.wait{border-color:color-mix(in oklch,var(--warn) 55%,transparent)}
.dico.arm,.dico.pc.arm{border-color:var(--warn);color:var(--warn);font-size:15px;animation:dico-pulse 1s ease-in-out infinite}
@keyframes dico-pulse{0%,100%{box-shadow:0 0 0 2px color-mix(in oklch,var(--warn) 28%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in oklch,var(--warn) 8%,transparent)}}

/* Delay profile chips */
.profiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:12px;font-weight:600;
  cursor:pointer;transition:border-color .15s var(--ease-out),color .15s,background-color .15s,transform .12s var(--ease-sheet)}
.pchip:hover:not(:disabled){border-color:var(--line-2);background:color-mix(in oklch,var(--accent) 6%,var(--surface-3))}
.pchip:active:not(:disabled){transform:scale(.96)}
.pchip .pv{font-size:10.5px;font-weight:600;color:var(--fg-3);font-variant-numeric:tabular-nums}
/* Profiles list mode: full-width rows, name left / delay right */
.profiles.plist{flex-direction:column;flex-wrap:nowrap;gap:5px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;
  color:var(--fg);font-size:12px;font-weight:600;cursor:pointer;
  transition:border-color .15s var(--ease-out),background-color .15s,transform .12s var(--ease-sheet)}
.prow:hover:not(:disabled){border-color:var(--line-2)}
.prow:active:not(:disabled){transform:scale(.98)}
.prow .pv{color:var(--fg-3);font-variant-numeric:tabular-nums;font-weight:600;font-size:11px}
/* The delay running now. */
.pchip.on,.prow.on{border-color:color-mix(in oklch,var(--accent) 55%,transparent);color:var(--accent);
  background:color-mix(in oklch,var(--accent) 12%,var(--panel));cursor:default}
.pchip.on .pv,.prow.on .pv{color:color-mix(in oklch,var(--accent) 70%,var(--fg-3))}
.pchip:disabled:not(.on):not(.toobig),.prow:disabled:not(.on):not(.toobig){opacity:.5;cursor:default}
/* Over buffer capacity: dimmed, struck, and inert (see currentCapMs). The
   tooltip explains how much buffer the delay would need. */
.pchip.toobig,.prow.toobig{opacity:.4;cursor:not-allowed;text-decoration:line-through;
  text-decoration-color:color-mix(in oklch,var(--warn) 70%,transparent)}

/* Health stats glance: inline row, or a tile grid for glanceability */
.stats{display:flex;flex-wrap:wrap;gap:5px 10px;justify-content:center;font-size:11px;color:var(--fg-3);
  font-variant-numeric:tabular-nums}
.stats .st b{color:var(--fg-2);font-weight:700}
.stats .st.bad{color:var(--warn);font-weight:600}
.stats .st.muted{color:var(--fg-4)}
.stats.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stats.tiles .tile{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.stats.tiles .tile b{font-size:14px;color:var(--fg);font-weight:800;font-variant-numeric:tabular-nums}
.stats.tiles .tile span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-4)}
.stats.tiles .st.bad{grid-column:1/-1;text-align:center;padding:4px}

/* Auto behavior + settings toggle rows */
.behavior,.settings{display:flex;flex-direction:column;gap:5px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;font-size:12px}
.blbl{color:var(--fg-2);font-weight:600;min-width:0}
.srow-btns{display:flex;gap:5px;flex:0 0 auto;align-items:center}

/* Overlays list */
.overlays{display:flex;flex-direction:column;gap:5px}
.orow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;font-size:12px}

  border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;outline:none;margin-bottom:3px;
  transition:border-color .2s var(--ease-out),box-shadow .2s var(--ease-out)}
.osearch::placeholder{color:var(--fg-4)}
.osearch:focus{border-color:color-mix(in oklch,var(--accent) 60%,transparent);
  box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 15%,transparent)}
.olist{display:flex;flex-direction:column;gap:5px}
.ogroup{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-4);font-weight:700;margin:6px 2px 1px}

/* Mini action buttons (settings, overlays, docks) */
.minibtn{flex:0 0 auto;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface-3);
  color:var(--fg-2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;

.minibtn:disabled{opacity:.4;cursor:not-allowed}
.minibtn.warn{color:var(--danger);border-color:color-mix(in oklch,var(--danger) 45%,transparent);
  background:color-mix(in oklch,var(--danger) 10%,var(--surface-3))}

    0 10px 26px -8px color-mix(in oklch,var(--accent) 55%,transparent)}
.btn.go{background:linear-gradient(180deg,color-mix(in oklch,#fff 12%,var(--live)),var(--live));color:#04140a;border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);animation:readyglow 1.8s ease-in-out infinite}

  border-color:color-mix(in oklch,var(--danger) 50%,transparent)}
.btn.danger:hover:not(:disabled){background:color-mix(in oklch,var(--danger) 26%,var(--surface-3));
  border-color:color-mix(in oklch,var(--danger) 60%,transparent);
  box-shadow:0 8px 22px -12px color-mix(in oklch,var(--danger) 80%,transparent)}

.cta-row{display:flex;gap:6px}
.cta-row .btn{flex:1}
.cta-row .btn.disarm{flex:0 0 auto;padding:10px 13px}

  font-variant-numeric:tabular-nums;animation:cutpulse 1.6s ease-in-out infinite}

/* Status-as-dot mode: collapse the chip to a colored dot of the state hue. */

/* Compact density: tighten spacing + type for gamers who want minimal chrome. */

/* Gear button - hidden until you mouse over the dock, so a live dock stays

/* Invisible halo: the gear is the dock's main entry point, keep it easy to hit. */

.editor{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;

.ehead{display:flex;align-items:center;gap:8px;margin-bottom:2px;min-width:0}
.ehead h3{margin:0;font-size:13.5px;font-weight:700;color:var(--fg);letter-spacing:-.005em;white-space:nowrap}
.ehead .slot{font-size:10.5px;font-weight:600;color:var(--fg-3);background:var(--panel-2);min-width:0;

.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;

  border-color:color-mix(in oklch,var(--accent) 55%,transparent);color:var(--accent)}

/* First-paint entrance: widgets rise in with a small stagger. The `boot`
   class comes off after one pass so saves/reorders never replay it. */

body.boot .wrap>*:nth-child(2){animation-delay:.04s}
body.boot .wrap>*:nth-child(3){animation-delay:.08s}
body.boot .wrap>*:nth-child(4){animation-delay:.12s}
body.boot .wrap>*:nth-child(5){animation-delay:.16s}

/* Keyboard focus ring, only for keyboard (not mouse) focus. */
:where(button,input,[tabindex]):focus-visible{outline:2px solid color-mix(in oklch,var(--accent) 60%,transparent);outline-offset:2px}
.cur input:focus-visible{outline:0}

/* Very narrow dock: shave the chrome so content keeps breathing room. */
@media (max-width:220px){
  .wrap{padding:7px;gap:6px}
  .top,.eg{flex-wrap:wrap}

}

      </span>
      <button class="np" id="plus" onclick="bump(1)" title="More delay" aria-label="More delay">+</button>
    </div>
    <div class="bar" id="w-bar"><span class="pct" id="pct" hidden></span><div class="fill" id="bar"></div></div>
    <span class="edit-cap" id="edit-cap" hidden></span>
  </div>
  <div class="hold" id="w-hold" role="status" hidden>
    <div class="hold-top"><span class="hold-why" id="hold-why">OBS dropped</span><span class="hold-clock" id="hold-clock" aria-live="off"></span></div>
    <div class="hold-sub" id="hold-sub"></div>
    <button class="btn full hold-end" id="hold-end" onclick="endHold()">End now</button>
  </div>
  <div class="eg" id="w-eg" hidden></div>
  <div class="tip" id="w-tip">Start streaming in OBS to InstantClone.</div>
  <div class="dests" id="w-dests" hidden></div>
  <div class="profiles" id="w-profiles" hidden></div>
  <div class="stats" id="w-stats" hidden></div>
  <div class="behavior" id="w-behavior" hidden></div>
  <div class="settings" id="w-settings" hidden></div>
  <div class="overlays" id="w-overlays" hidden></div>
  <div class="cta-row" id="w-cta">
    <button class="btn full" id="main" onclick="mainClick()" disabled>-</button>
    <button class="btn ghost disarm" id="cancel" onclick="secondaryClick()" hidden title="Cancel arming" aria-label="Cancel arming">&times;</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"><span class="t-ic" aria-hidden="true"></span><span class="t-msg"></span></div>
<script src="/dock.js"></script>
</body></html>
