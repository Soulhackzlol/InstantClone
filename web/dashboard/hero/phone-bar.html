<!-- Phone delay bar: the delay and its main button, once the card scrolls away. -->
<div class="mini-bar" id="mini-bar" hidden>
  <button type="button" class="mini-read" id="mini-read" aria-label="Back to the delay">
    <span class="mini-dot" id="mini-dot"></span>
    <span class="mini-num mono" id="mini-num">0.0</span><span class="mini-unit">s</span>
    <span class="mini-state" id="mini-state"></span>
  </button>
  <button type="button" class="ic-btn mini-cta" id="mini-cta"></button>
</div>
