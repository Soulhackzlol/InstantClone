<!-- - Header ------------------─ -->
<header class="ic-header" id="hdr-bar" hidden>
  <div class="ic-brand">
    <span class="ic-brand-mark">InstantClone</span>
    <span class="ic-brand-sep">&middot;</span>
    <span class="ic-brand-sub">made by <a href="https://github.com/Soulhackzlol" target="_blank" rel="noopener">s1moscs</a></span>
  </div>
  <div class="ic-header-right">
    <span class="ic-pill" id="hdr-obs" title="Input from OBS.">
      <span class="dot"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic-pill-ic"><path d="M8 2.5v7"/><path d="M5 6.5 8 9.5l3-3"/><path d="M3.5 13h9"/></svg>
      <span class="ic-pill-k">OBS</span><span class="ic-pill-v" id="hdr-obs-v">Offline</span>
    </span>
    <span class="ic-pill" id="hdr-egress" title="Where InstantClone sends your stream.">
      <span class="dot"></span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic-pill-ic"><path d="M8 13.5v-7"/><path d="M5 9.5 8 6.5l3 3"/><path d="M3.5 3h9"/></svg>
      <span class="ic-pill-k">Sending</span><span class="ic-pill-v" id="hdr-egress-v">Off</span>
    </span>
    <span class="ic-pill ic-pill-rate idle" id="hdr-rate-pill" title="Total bitrate flowing through InstantClone right now.">
      <span class="ic-pill-v mono"><span id="hdr-rate">Idle</span> <span class="unit" id="hdr-rate-u"></span></span>
    </span>
    <span class="ic-pill" id="hdr-codec" hidden><span class="mono" id="hdr-codec-v">-</span></span>
    <span class="ic-pill ok" id="hdr-ebroadcast" hidden title="Enhanced Broadcasting is on. Twitch gets every quality OBS sends. Other destinations get the main track, or the vertical one when set to Vertical."><span aria-hidden="true">⚡</span><span class="hdr-word">Enhanced Broadcasting</span></span>
    <span class="ic-pill ok" id="hdr-dualformat" hidden title="A vertical 9:16 canvas is coming in. Every destination set to Vertical gets it (TikTok, YouTube Shorts, Kick mobile, etc.)."><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" class="ic-pill-ic"><rect x="0.8" y="4.5" width="8.2" height="6.6" rx="1.2"/><rect x="10" y="2.4" width="4.4" height="11.2" rx="1.2"/></svg><span class="hdr-word">Vertical</span></span>
    <span class="ic-pill bad" id="hdr-backpressure" hidden title="A destination's upload can't keep up with OBS's bitrate. Lower OBS bitrate or check upload speed.">⚠ Upload bottleneck</span>
    <span class="ic-pill warn" id="hdr-twitch-cap" hidden>⚠ <span id="hdr-twitch-cap-v">Twitch · Source-Only at 10 Mbps</span></span>
    <a id="hdr-update" class="ic-pill" href="#" hidden title="Open the updater" onclick="openUpdateInAbout();return false;" style="cursor:pointer">⬆ <span id="hdr-update-v">update available</span></a>
    <a id="hdr-whats-new" class="ic-pill ok" href="#" hidden title="See what changed" onclick="openWhatsNew();return false;" style="cursor:pointer">✓ <span id="hdr-whats-new-v">Updated</span></a>
    <button id="hdr-compact" class="ic-btn-tiny hdr-round" aria-pressed="false" aria-label="Compact delay panel"
      title="Compact the delay panel: more room for the tabs" onclick="setHeroCompact(!heroCompact(), true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14M5 20h14"/><path class="hdr-compact-chev" d="m8 14 4-4 4 4"/></svg>
    </button>
    <button id="hdr-help" class="ic-btn-tiny hdr-round" title="How does this work? (?)" onclick="openTour(0)">?
      <span id="hdr-help-hint" class="help-hint" hidden>New here? Quick tour →</span>
    </button>
  </div>
</header>

<!-- - Encoder compatibility (only when something is actually wrong) - -->
<div id="compat-warn" role="status" aria-live="polite" hidden>
  <span class="cw-ic" aria-hidden="true">⚠</span>
  <span class="cw-text" id="compat-warn-text"></span>
  <button class="cw-x" id="compat-warn-x" title="Dismiss until this changes" aria-label="Dismiss compatibility warning" onclick="dismissCompatWarning()">✕</button>
</div>
