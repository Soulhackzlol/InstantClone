<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstantClone alerts</title>
<!--
  The alerts browser source: add http://127.0.0.1:<port>/alerts to OBS as a
  Browser source. "Show on stream" steps put a card here. Each new alert
  plays once, in order; ones already up when the page loads are skipped, so
  switching scenes never replays old alerts.

  How cards look is the dashboard's theme (Integrations > Alerts page),
  sent with every update: a ready-made theme (body.theme-*), then whatever
  was changed in it as --*-user variables on <body>, then custom CSS last.
  Each theme is its own build: its shape, extras (.fx), how it comes in,
  what it does while up, and how it goes. "Comes in with" swaps only the
  entrance. Each alert can bring its own accent (--card-color), sound and
  picture. ?at=top in the address still wins, for setups made before.
  ?demo is the dashboard's preview: no feed, it shows what it is sent.
  ?embed is an "Alert card" layer inside a design: one card in the look
  the layer gives it, drawn when the design says, with no feed and no
  sound (the alerts page around the design has those).

  An alert can name a design (an overlay made in the Studio) instead; an
  alert that names none takes the default design, if there is one.
-->
<style>
  :root{--ease:cubic-bezier(.16,1,.3,1);--k:1}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  /* --u is one pixel at the chosen size. */
  body{--u:calc(var(--k)*1px);display:flex;justify-content:center;align-items:flex-end;padding:48px;box-sizing:border-box;
    font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
  body.top{align-items:flex-start}
  body.middle{align-items:center}
  body.left{justify-content:flex-start}
  body.right{justify-content:flex-end}

  /* ---- the parts every theme builds from: .card holds .fx (extras),
     .pic, .words (.title, .text with its words .w and letters .c) and
     .time, the bar that runs out while the alert is up. */
  .card{--bg:color-mix(in srgb,var(--bg-base) calc(var(--op)*100%),transparent);
    position:relative;display:flex;align-items:center;gap:calc(18*var(--u));
    max-width:min(calc(var(--w,720px)*var(--k)),100%);box-sizing:border-box;
    padding:calc(18*var(--u)) calc(28*var(--u)) calc(20*var(--u));
    border-radius:calc(var(--r)*var(--k));background:var(--bg);color:var(--fg);font-family:var(--font);opacity:0}
  .fx{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
  .fx i{position:absolute;display:block}
  .pic{position:relative;flex:none;width:calc(84*var(--u));height:calc(84*var(--u));border-radius:calc(12*var(--u));object-fit:cover}
  .words{position:relative;min-width:0}
  .title{font-size:calc(13*var(--u));font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:calc(4*var(--u))}
  .title:empty{display:none}
  .text{font-size:calc(26*var(--u));font-weight:650;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .msg{margin-top:calc(6*var(--u));font-size:calc(16*var(--u));font-weight:500;opacity:.85;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  .msg:empty{display:none}
  .w{display:inline-block}
  .time{position:absolute;left:0;right:0;bottom:0;height:calc(3*var(--u))}
  .time i{display:block;height:100%;background:var(--accent);transform-origin:left}
  body.pic-top .card{flex-direction:column;text-align:center}
  body.pic-top .pic{width:calc(120*var(--u));height:calc(120*var(--u))}

  /* ---- coming in and going out. The theme's own entrance unless one is
     picked; its own exit always. A card's resting look is its finished
     one, so the dashboard's still preview needs no motion at all. */
  .card.in{opacity:1;animation:var(--in) .6s var(--ease) both}
  body.anim-theme .card.in{animation:var(--theme-in)}
  body .card.in.out{animation:var(--theme-out)}
  body .card.in.still{animation:none}
  .card.still::before,.card.still::after,.card.still *,.card.still *::before,.card.still *::after{animation:none !important}
  body.top{--slide:slideDown}
  body.anim-slide{--in:var(--slide,slideUp)}
  body.anim-pop{--in:pop} body.anim-fade{--in:fade} body.anim-zoom{--in:zoom}
  body.anim-bounce{--in:bounce} body.anim-drop{--in:drop}
  @keyframes slideUp{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(6px)}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-28px) scale(.97);filter:blur(6px)}}
  @keyframes pop{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.06)}100%{transform:none}}
  @keyframes fade{from{opacity:0}}
  @keyframes zoom{from{opacity:0;transform:scale(1.35);filter:blur(10px)}}
  @keyframes bounce{0%{opacity:0;transform:translateY(-70px)}45%{opacity:1;transform:translateY(0)}65%{transform:translateY(-16px)}82%{transform:translateY(0)}92%{transform:translateY(-5px)}100%{transform:none}}
  @keyframes drop{0%{opacity:0;transform:translateY(-120%) rotate(-3deg)}70%{opacity:1;transform:translateY(6%) rotate(1deg)}100%{transform:none}}
  @keyframes fadeOut{to{opacity:0}}

  /* ==== Island: a black capsule, like a phone's live island. It grows
     out of a dot, keeps a small live equalizer going while up, and
     shrinks back into the dot. */
  body.theme-island{--theme-in:islandIn .8s cubic-bezier(.3,.7,.2,1) both;--theme-out:islandOut .6s cubic-bezier(.5,0,.6,1) forwards}
  body.theme-island .card{--accent:var(--card-color,var(--accent-user,#5ac8fa));--bg-base:var(--bg-user,#000000);
    --op:var(--op-user,.96);--fg:var(--fg-user,#ffffff);--r:var(--r-user,40px);
    --font:var(--font-user,"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif);
    gap:calc(14*var(--u));padding:calc(12*var(--u)) calc(70*var(--u)) calc(14*var(--u)) calc(12*var(--u));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  body.theme-island .words{padding-right:calc(4*var(--u))}
  body.theme-island .title{font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:0;text-transform:none;
    color:color-mix(in srgb,var(--fg) 55%,transparent);margin-bottom:calc(1*var(--u))}
  body.theme-island .text{font-size:calc(21*var(--u));font-weight:600;letter-spacing:-.015em}
  body.theme-island .pic{width:calc(54*var(--u));height:calc(54*var(--u));border-radius:50%}
  body.pic-top.theme-island .card{padding:calc(20*var(--u)) calc(34*var(--u)) calc(38*var(--u))}
  body.pic-top.theme-island .pic{width:calc(76*var(--u));height:calc(76*var(--u))}
  /* The equalizer: five bars, each its own height and pace. */
  body.theme-island .fx i{top:50%;width:calc(3.5*var(--u));height:calc(20*var(--u));margin-top:calc(-10*var(--u));
    border-radius:99px;background:var(--accent);scale:1 var(--h)}
  body.theme-island .fx i:nth-child(1){right:calc(48*var(--u));--h:.45;--t:.9s}
  body.theme-island .fx i:nth-child(2){right:calc(41*var(--u));--h:.9;--t:.7s;--d:.2s}
  body.theme-island .fx i:nth-child(3){right:calc(34*var(--u));--h:.6;--t:.8s;--d:.1s}
  body.theme-island .fx i:nth-child(4){right:calc(27*var(--u));--h:1;--t:.65s;--d:.3s}
  body.theme-island .fx i:nth-child(5){right:calc(20*var(--u));--h:.5;--t:.85s;--d:.15s}
  body.pic-top.theme-island .fx i{top:auto;bottom:calc(14*var(--u));margin:0}
  body.pic-top.theme-island .fx i:nth-child(1){right:calc(50% + 10*var(--u))}
  body.pic-top.theme-island .fx i:nth-child(2){right:calc(50% + 3*var(--u))}
  body.pic-top.theme-island .fx i:nth-child(3){right:calc(50% - 4*var(--u))}
  body.pic-top.theme-island .fx i:nth-child(4){right:calc(50% - 11*var(--u))}
  body.pic-top.theme-island .fx i:nth-child(5){right:calc(50% - 18*var(--u))}
  body.theme-island .fx i:nth-child(n+6){display:none}
  body.theme-island .time{left:calc(30*var(--u));right:calc(30*var(--u));bottom:calc(5*var(--u));height:calc(2*var(--u));
    border-radius:99px;background:rgba(255,255,255,.1)}
  body.theme-island .time i{border-radius:inherit;opacity:.85}
  body.theme-island .card.in .pic,body.theme-island .card.in .words{animation:islandContent .55s .32s var(--ease) both}
  body.theme-island .card.in .fx i{animation:islandContent .4s .45s ease both,islandEq var(--t) calc(.45s + var(--d,0s)) ease-in-out infinite alternate}
  body.theme-island .card.in.out .pic,body.theme-island .card.in.out .words,body.theme-island .card.in.out .fx,
    body.theme-island .card.in.out .time{animation:fadeOut .18s ease forwards}
  @keyframes islandIn{
    0%{opacity:0;clip-path:inset(calc(50% - 9*var(--u)) calc(50% - 9*var(--u)) round 999px)}
    12%{opacity:1}
    38%{clip-path:inset(calc(50% - 17*var(--u)) calc(50% - 64*var(--u)) round 999px)}
    72%{clip-path:inset(calc(-3*var(--u)) calc(-7*var(--u)) round calc(var(--r)*var(--k)))}
    100%{clip-path:inset(0 round calc(var(--r)*var(--k)))}}
  @keyframes islandOut{
    0%,22%{clip-path:inset(0 round calc(var(--r)*var(--k)))}
    62%{opacity:1;clip-path:inset(calc(50% - 17*var(--u)) calc(50% - 64*var(--u)) round 999px)}
    100%{opacity:0;clip-path:inset(calc(50% - 5*var(--u)) calc(50% - 5*var(--u)) round 999px)}}
  @keyframes islandContent{from{opacity:0;transform:scale(.9);filter:blur(6px)}}
  @keyframes islandEq{from{scale:1 .22}to{scale:1 1}}

  /* ==== Signal: an esports HUD. A scan line draws the panel, its corner
     brackets snap out, the words decode from scrambled letters, and it
     glitches away. */
  body.theme-signal{--theme-in:fade .1s linear both;--theme-out:signalOut .5s linear forwards}
  body.theme-signal .card{--accent:var(--card-color,var(--accent-user,#3ee0c5));--bg-base:var(--bg-user,#0b0f14);
    --op:var(--op-user,.86);--fg:var(--fg-user,#eef4ff);--r:var(--r-user,0px);--font:var(--font-user,"Chakra Petch",system-ui,sans-serif);
    --font2:"Roboto Mono",ui-monospace,monospace;--ch:calc(16*var(--u));
    --shape:polygon(0 var(--ch),var(--ch) 0,100% 0,100% calc(100% - var(--ch)),calc(100% - var(--ch)) 100%,0 100%);
    isolation:isolate;background:none;padding:calc(20*var(--u)) calc(34*var(--u)) calc(24*var(--u)) calc(22*var(--u))}
  /* The panel: an accent edge (::before) under the face (::after), both cut. */
  body.theme-signal .card::before,body.theme-signal .card::after{content:"";position:absolute;inset:0;z-index:-1;clip-path:var(--shape)}
  body.theme-signal .card::before{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 25%,transparent) 40%,
    color-mix(in srgb,var(--accent) 15%,transparent) 70%,var(--accent))}
  body.theme-signal .card::after{inset:1px;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
      linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 45%),var(--bg)}
  body.theme-signal .fx i:nth-child(-n+4){width:calc(14*var(--u));height:calc(14*var(--u));border:0 solid var(--accent)}
  body.theme-signal .fx i:nth-child(1){left:calc(-7*var(--u));top:calc(-7*var(--u));border-width:calc(2*var(--u)) 0 0 calc(2*var(--u));--x:1;--y:1}
  body.theme-signal .fx i:nth-child(2){right:calc(-7*var(--u));top:calc(-7*var(--u));border-width:calc(2*var(--u)) calc(2*var(--u)) 0 0;--x:-1;--y:1}
  body.theme-signal .fx i:nth-child(3){left:calc(-7*var(--u));bottom:calc(-7*var(--u));border-width:0 0 calc(2*var(--u)) calc(2*var(--u));--x:1;--y:-1}
  body.theme-signal .fx i:nth-child(4){right:calc(-7*var(--u));bottom:calc(-7*var(--u));border-width:0 calc(2*var(--u)) calc(2*var(--u)) 0;--x:-1;--y:-1}
  body.theme-signal .fx i:nth-child(5){top:calc(-10*var(--u));bottom:calc(-10*var(--u));left:100%;width:calc(2*var(--u));opacity:0;
    background:var(--accent);box-shadow:0 0 calc(14*var(--u)) var(--accent),0 0 calc(3*var(--u)) #fff}
  body.theme-signal .fx i:nth-child(6){top:calc(9*var(--u));right:calc(16*var(--u));width:calc(46*var(--u));height:calc(5*var(--u));opacity:.6;
    background:repeating-linear-gradient(90deg,var(--accent) 0 calc(2*var(--u)),transparent calc(2*var(--u)) calc(5*var(--u)))}
  body.theme-signal .title{display:flex;align-items:center;gap:calc(8*var(--u));font-family:var(--font2);font-size:calc(11.5*var(--u));
    font-weight:600;letter-spacing:.18em;margin-bottom:calc(5*var(--u))}
  body.theme-signal .title::before{content:"";flex:none;width:calc(7*var(--u));height:calc(7*var(--u));background:var(--accent)}
  body.pic-top.theme-signal .title{justify-content:center}
  body.theme-signal .text{font-weight:600;letter-spacing:.01em;line-height:1.2}
  body.theme-signal .c{position:relative}
  body.theme-signal .c[data-g]{color:transparent}
  body.theme-signal .c[data-g]::after{content:attr(data-g);position:absolute;left:0;top:0;color:var(--accent)}
  body.theme-signal .pic{border-radius:0;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 70%,transparent),
    0 0 0 calc(4*var(--u)) color-mix(in srgb,var(--accent) 12%,transparent)}
  body.theme-signal .time{left:calc(22*var(--u));right:calc(34*var(--u));bottom:calc(9*var(--u));height:calc(2*var(--u));
    background:color-mix(in srgb,var(--accent) 16%,transparent)}
  body.theme-signal .card.in::before,body.theme-signal .card.in::after{animation:signalDraw .55s cubic-bezier(.65,0,.35,1) both}
  body.theme-signal .card.in .fx i:nth-child(5){animation:signalScan .55s cubic-bezier(.65,0,.35,1) both}
  body.theme-signal .card.in .fx i:nth-child(-n+4){animation:signalBracket .45s .35s cubic-bezier(.2,1.2,.3,1) both}
  body.theme-signal .card.in .fx i:nth-child(6),body.theme-signal .card.in .pic{animation:signalBlink .45s .4s steps(1,end) both}
  body.theme-signal .card.in .title{animation:signalBlink .4s .3s steps(1,end) both}
  body.theme-signal .card.in .text{animation:signalSplit .7s .3s ease-out both}
  body.theme-signal .card.in .time{animation:fade .3s .6s both}
  @keyframes signalDraw{from{clip-path:polygon(0 var(--ch),0 0,0 0,0 calc(100% - var(--ch)),0 100%,0 100%)}to{clip-path:var(--shape)}}
  @keyframes signalScan{0%{left:0;opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
  @keyframes signalBracket{from{opacity:0;transform:translate(calc(var(--x)*18*var(--u)),calc(var(--y)*10*var(--u)))}}
  @keyframes signalBlink{0%{opacity:0}25%{opacity:1}50%{opacity:.2}75%,100%{opacity:1}}
  @keyframes signalSplit{from{opacity:0;text-shadow:calc(-4*var(--u)) 0 rgba(255,40,100,.85),calc(4*var(--u)) 0 rgba(40,220,255,.85)}
    20%{opacity:1}to{text-shadow:0 0 transparent,0 0 transparent}}
  @keyframes signalOut{
    0%{transform:none;clip-path:inset(calc(-20*var(--u)))}
    12%{transform:translateX(calc(-9*var(--u))) skewX(-8deg)}
    20%{transform:translateX(calc(7*var(--u)));clip-path:inset(30% calc(-20*var(--u)) 20% calc(-20*var(--u)))}
    28%{transform:none;clip-path:inset(calc(-20*var(--u)))}
    60%{opacity:1;clip-path:inset(calc(50% - 1*var(--u)) calc(-20*var(--u)))}
    100%{opacity:0;clip-path:inset(calc(50% - 1*var(--u)) 50%)}}

  /* ==== Banner: a broadcast lower third. A dark edge wipes it on, the
     words come up from under the line, and it wipes off the other way. */
  body.theme-banner{--theme-in:bannerIn .7s cubic-bezier(.7,0,.2,1) both;--theme-out:bannerOut .55s cubic-bezier(.7,0,.3,1) forwards}
  body.theme-banner .card{--accent:var(--card-color,var(--accent-user,#fcd34d));--bg-base:var(--bg-user,var(--accent));
    --op:var(--op-user,1);--fg:var(--fg-user,#0b0d12);--r:var(--r-user,0px);--font:var(--font-user,"Bebas Neue","Oswald",system-ui,sans-serif);
    --w:980px;--cut:calc(34*var(--u));
    padding:calc(16*var(--u)) calc(30*var(--u) + var(--cut)) calc(18*var(--u)) calc(32*var(--u));
    border-radius:calc(var(--r)*var(--k)) 0 0 calc(var(--r)*var(--k));
    clip-path:polygon(0 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);
    background:repeating-linear-gradient(-60deg,transparent 0 calc(12*var(--u)),rgba(0,0,0,.045) calc(12*var(--u)) calc(24*var(--u))),var(--bg)}
  body.theme-banner .fx i:nth-child(1){left:0;top:0;bottom:0;width:calc(8*var(--u));background:var(--fg)}
  body.theme-banner .fx i:nth-child(2){top:0;bottom:0;left:105%;width:calc(70*var(--u));background:var(--fg);transform:skewX(-28deg)}
  body.theme-banner .title{display:inline-block;padding:.3em .8em .2em;margin-bottom:calc(6*var(--u));transform:skewX(-10deg);
    background:var(--fg);color:var(--bg-base);font-size:calc(16*var(--u));font-weight:400;letter-spacing:.14em}
  body.theme-banner .text{overflow:hidden;font-size:calc(46*var(--u));font-weight:400;letter-spacing:.02em;text-transform:uppercase;line-height:1.02}
  body.theme-banner .pic{border-radius:0;box-shadow:0 0 0 calc(3*var(--u)) var(--fg)}
  body.theme-banner .time{height:calc(5*var(--u));background:rgba(0,0,0,.16)}
  body.theme-banner .time i{background:var(--fg);opacity:.55}
  body.theme-banner .card.in .fx i:nth-child(2){animation:bannerWipe .7s cubic-bezier(.7,0,.2,1) both}
  body.theme-banner .card.in .title{animation:bannerTab .45s .4s cubic-bezier(.2,.9,.2,1) both}
  body.theme-banner .card.in .pic{animation:bannerPunch .5s .35s cubic-bezier(.3,1.5,.5,1) both}
  body.theme-banner .card.in .w{animation:bannerWord .55s calc(.45s + var(--wi)*var(--wstep)) cubic-bezier(.2,.9,.2,1) both}
  body.theme-banner .card.in.out .w{animation:bannerWordOut .28s calc(var(--wi)*20ms) ease-in forwards}
  @keyframes bannerIn{from{clip-path:polygon(0 0,var(--cut) 0,0 100%,0 100%)}}
  @keyframes bannerOut{to{clip-path:polygon(100% 0,100% 0,calc(100% - var(--cut)) 100%,calc(100% - var(--cut)) 100%)}}
  @keyframes bannerWipe{from{left:calc(-70*var(--u))}to{left:100%}}
  @keyframes bannerTab{from{opacity:0;transform:translateX(calc(-24*var(--u))) skewX(-10deg)}}
  @keyframes bannerPunch{from{transform:scale(0) rotate(-8deg)}}
  @keyframes bannerWord{from{transform:translateY(105%)}}
  @keyframes bannerWordOut{to{transform:translateY(-105%)}}

  /* ==== Bubble: a sticker speech bubble. It boings out of its tail with
     confetti, each word pops, it bobs while up and pops away. */
  body.theme-bubble{--theme-in:bubbleIn .75s ease-in-out both,bubbleBob 3s .9s ease-in-out infinite;--theme-out:bubbleOut .4s ease-in forwards}
  body.theme-bubble .card{--accent:var(--card-color,var(--accent-user,#a78bfa));--bg-base:var(--bg-user,#ffffff);
    --op:var(--op-user,1);--fg:var(--fg-user,#1b1d24);--r:var(--r-user,30px);--font:var(--font-user,"Fredoka","Rubik",system-ui,sans-serif);
    --ink:color-mix(in srgb,var(--accent) 55%,#000);
    margin-bottom:calc(16*var(--u));padding:calc(18*var(--u)) calc(30*var(--u)) calc(28*var(--u)) calc(20*var(--u));
    transform-origin:calc(46*var(--u)) calc(100% + 14*var(--u));
    box-shadow:0 0 0 calc(4*var(--u)) var(--accent),calc(5*var(--u)) calc(7*var(--u)) 0 calc(4*var(--u)) var(--ink)}
  body.theme-bubble .card::after{content:"";position:absolute;left:calc(34*var(--u));bottom:calc(-11*var(--u));
    width:calc(22*var(--u));height:calc(22*var(--u));background:var(--bg);transform:rotate(45deg);
    box-shadow:calc(4*var(--u)) calc(4*var(--u)) 0 0 var(--accent)}
  body.pic-top.theme-bubble .card{transform-origin:50% calc(100% + 14*var(--u))}
  body.pic-top.theme-bubble .card::after{left:calc(50% - 11*var(--u))}
  body.theme-bubble .fx i{left:50%;top:50%;width:calc(11*var(--u));height:calc(11*var(--u));border-radius:50%;opacity:0;background:var(--accent)}
  body.theme-bubble .fx i:nth-child(1){--x:calc(-190*var(--u));--y:calc(-60*var(--u))}
  body.theme-bubble .fx i:nth-child(2){--x:calc(180*var(--u));--y:calc(-72*var(--u));background:#ffc94d;border-radius:2px}
  body.theme-bubble .fx i:nth-child(3){--x:calc(-150*var(--u));--y:calc(56*var(--u));background:#ff7aa8}
  body.theme-bubble .fx i:nth-child(4){--x:calc(170*var(--u));--y:calc(62*var(--u));background:var(--ink);border-radius:2px}

<body class="theme-island anim-theme">
<script>
'use strict';
(function(){
  const params = new URLSearchParams(location.search);
  const pinnedTop = params.get('at') === 'top';
  const demo = params.has('demo');
  const embed = params.has('embed');
  // This page's own fingerprint, filled in when served (alerts::page_id).
  const PAGE = '__ALERTS_PAGE_ID__';
  // The pause between two alerts, and the longest a card waits for its
  // theme's exit to end before it goes anyway.
  const GAP = 250, LEAVE_MAX = 1200;
  // How long the dashboard's full preview keeps a card up before it leaves.
  const DEMO_HOLD = 2400;
  // The extras (.fx) a theme can draw with.
  const FX = 7;
  // Each theme's own sound, font (and the second one some use for their
  // titles), picture place, and whether its words decode from scrambled
  // letters; its motion is in the CSS. The dashboard keeps the same table
  // (THEMES in integrations.js).
  const THEMES = {
    island:{sound:'chime', font:'Inter', pic:'left'},
    signal:{sound:'zap', font:'Chakra Petch', font2:'Roboto Mono', pic:'left', decode:true},
    banner:{sound:'fanfare', font:'Bebas Neue', pic:'left'},
    bubble:{sound:'pop', font:'Fredoka', pic:'left'},
    minimal:{sound:'blip', font:'Inter', pic:'left'},
    paper:{sound:'whoosh', font:'Permanent Marker', font2:'Special Elite', pic:'left'},
    cinema:{sound:'bell', font:'Playfair Display', font2:'Inter', pic:'top'},
  };
  // The styles Google Fonts has for each; one-style fonts ask for none.
  const AXES = {Inter:'wght@400;500;600;700;800', Poppins:'wght@400;600;700;800', Montserrat:'wght@400;600;700;800',
    Fredoka:'wght@400;600;700', Rubik:'wght@400;600;700;800', Oswald:'wght@400;600;700', Orbitron:'wght@400;600;700;800',
    'Roboto Mono':'wght@400;600;700', 'Chakra Petch':'wght@400;500;600;700', 'Playfair Display':'ital,wght@0,400;0,700;1,400;1,600'};
  const queue = [];
  let boot = null, seen = null, playing = false;
  // The dock's Skip: how many the app has asked for, and what ends the
  // alert on now (null between alerts), with the sound file it plays.
  let skips = null, current = null, fileSound = null;
  let look = {};

  function themeOf(l){ return THEMES[l.theme] ? l.theme : 'island'; }

  function loadFont(font){
    if (!font || font === 'system' || document.querySelector(`link[data-font="${CSS.escape(font)}"]`)) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.dataset.font = font;
    const axes = AXES[font] ? ':' + AXES[font] : '';
    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font).replace(/%20/g, '+')}${axes}&display=swap`;
    document.head.appendChild(link);
  }

  // The theme, then what was changed in it.
  function applyLook(next){
    look = next || {};
    const theme = themeOf(look), own = THEMES[theme];
    const body = document.body, cls = [];
    cls.push('theme-' + theme);
    // A card layer sits where its look says inside its own box (at the
    // bottom, in the middle, unless told).
    const position = pinnedTop && !embed ? 'top' : look.position;
    if (position === 'top' || position === 'middle') cls.push(position);
    if (look.align === 'left' || look.align === 'right') cls.push(look.align);
    if (embed) cls.push('embed');
    cls.push('anim-' + (look.animation || 'theme'));
    if ((look.picture || own.pic) === 'top') cls.push('pic-top');
    body.className = cls.join(' ');
    const set = (name, value) => value === '' || value == null ? body.style.removeProperty(name) : body.style.setProperty(name, value);
    const hex = v => /^#[0-9a-f]{6}$/i.test(v || '') ? v : '';
    set('--k', (Number(look.scale) || 100) / 100);
    set('--accent-user', hex(look.accent));
    set('--bg-user', hex(look.background));
    set('--fg-user', hex(look.text));
    set('--op-user', look.opacity == null ? '' : Math.max(0, Math.min(100, look.opacity)) / 100);
    set('--r-user', look.radius == null ? '' : Math.max(0, Math.min(48, look.radius)) + 'px');
    const font = look.font || own.font;
    set('--font-user', look.font ? (look.font === 'system' ? 'system-ui,"Segoe UI",sans-serif' : `"${look.font}",system-ui,sans-serif`) : '');

    loadFont(own.font2);

  // `media:<name>` is an upload served next to this page. A card layer is
  // handed it as that address already, or the Studio's sample picture.
  function mediaSrc(ref){
    if (/^media:[a-z0-9._-]+$/.test(ref || '')) return '/alerts/media/' + ref.slice(6);
    if (embed && /^(\/alerts\/media\/[a-z0-9._-]+|data:image\/svg\+xml,[^"'<>]*)$/.test(ref || '')) return ref;

  // bring them in one at a time. The steps shrink for a long text, so it
  // never takes much longer to show than a short one.

    ? (s => Array.from(new Intl.Segmenter(undefined, {granularity:'grapheme'}).segment(s), g => g.segment))
    : (s => Array.from(s));
  function spellOut(box, text){
    let words = 0, letters = 0;
    for (const part of text.split(/(\s+)/)){
      if (!part) continue;
      if (/^\s+$/.test(part)){ box.append(' '); continue; }
      const word = document.createElement('span');
      word.className = 'w';
      word.style.setProperty('--wi', words++);
      for (const g of graphemes(part)){
        const letter = document.createElement('span');
        letter.className = 'c';
        letter.style.setProperty('--ci', letters++);
        letter.textContent = g;
        word.append(letter);
      }
      box.append(word);
    }
    box.style.setProperty('--cn', letters);
    box.style.setProperty('--wstep', Math.min(70, 700 / Math.max(words, 1)) + 'ms');
    box.style.setProperty('--cstep', Math.min(34, 1500 / Math.max(letters, 1)) + 'ms');
  }

  function card(alert){
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<span class="fx" aria-hidden="true">${'<i></i>'.repeat(FX)}</span>`
      + '<div class="words"><div class="title"></div><div class="text"></div><div class="msg"></div></div><div class="time"><i></i></div>';
    el.querySelector('.title').textContent = alert.title || '';
    el.querySelector('.msg').textContent = alert.message || '';
    spellOut(el.querySelector('.text'), alert.text || '');
    if (/^#[0-9a-f]{6}$/i.test(alert.color || '')) el.style.setProperty('--card-color', alert.color);
    const src = mediaSrc(alert.image);
    if (src){
      const pic = document.createElement('img');
      pic.className = 'pic';
      pic.alt = '';
      pic.src = src;
      pic.onerror = () => pic.remove();
      el.querySelector('.words').before(pic);
    }
    return el;
  }

  // A theme that decodes shows each letter scrambled until its turn comes,
  // left to right. The real letter keeps its place (alerts.html CSS), so
  // nothing reflows while it settles.
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+<>/';
  function decode(el){
    if (!THEMES[themeOf(look)].decode || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const letters = [...el.querySelectorAll('.text .c')];
    if (!letters.length) return;
    const start = performance.now() + 300, step = Math.min(40, 900 / letters.length);
    // New scrambled letters a little slower than the screen redraws, so
    // they read as letters and not as noise.
    let shuffled = 0;
    const tick = now => {
      const shuffle = now - shuffled >= 55;
      if (shuffle) shuffled = now;
      let waiting = 0;
      letters.forEach((c, i) => {
        if (now >= start + i * step){ c.removeAttribute('data-g'); return; }
        waiting++;
        if (shuffle) c.dataset.g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      });
      if (waiting && el.isConnected) requestAnimationFrame(tick);
    };
    tick(performance.now());
  }

  // The card leaves its theme's way, then `then` runs. If nothing
  // animates (custom CSS can turn it off), it goes after LEAVE_MAX.
  function leave(el, then){
    let gone = false;
    const done = () => {
      if (gone) return;
      gone = true;
      el.remove();
      then();
    };
    el.addEventListener('animationend', e => { if (e.target === el) done(); });
    setTimeout(done, LEAVE_MAX);
    el.classList.add('out');
  }

  // ---- sounds: ten made here, or a file (uploaded or linked).
  let audio = null;
  function tone(at, freq, endFreq, length, type, gain){
    const osc = audio.createOscillator(), amp = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, at);
    if (endFreq !== freq) osc.frequency.exponentialRampToValueAtTime(endFreq, at + length);
    amp.gain.setValueAtTime(0.0001, at);
    amp.gain.exponentialRampToValueAtTime(gain, at + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, at + length);
    osc.connect(amp).connect(audio.destination);
    osc.start(at);
    osc.stop(at + length + 0.05);
  }
  function noise(at, length, from, to, gain){
    const buffer = audio.createBuffer(1, Math.ceil(audio.sampleRate * length), audio.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = audio.createBufferSource(), band = audio.createBiquadFilter(), amp = audio.createGain();
    src.buffer = buffer;
    band.type = 'bandpass';
    band.Q.value = 1.4;
    band.frequency.setValueAtTime(from, at);
    band.frequency.exponentialRampToValueAtTime(to, at + length);
    amp.gain.setValueAtTime(0.0001, at);
    amp.gain.exponentialRampToValueAtTime(gain, at + length * 0.4);
    amp.gain.exponentialRampToValueAtTime(0.0001, at + length);
    src.connect(band).connect(amp).connect(audio.destination);
    src.start(at);
  }
  const SOUNDS = {
    chime: (t, g) => { tone(t, 1318.5, 1318.5, 0.5, 'sine', g); tone(t + 0.11, 1975.5, 1975.5, 0.7, 'sine', g * 0.8); },
    pop: (t, g) => tone(t, 620, 180, 0.14, 'sine', g),
    bell: (t, g) => { tone(t, 880, 880, 1.4, 'triangle', g); tone(t, 1760, 1760, 0.9, 'sine', g * 0.35); tone(t, 2637, 2637, 0.5, 'sine', g * 0.15); },
    rise: (t, g) => { tone(t, 392, 1175, 0.32, 'sine', g); tone(t + 0.3, 1568, 1568, 0.45, 'sine', g * 0.7); },
    coin: (t, g) => { tone(t, 988, 988, 0.09, 'square', g * 0.35); tone(t + 0.08, 1319, 1319, 0.4, 'square', g * 0.35); },
    sparkle: (t, g) => [2093, 2637, 3136, 3951, 3136].forEach((f, n) => tone(t + n * 0.06, f, f, 0.28, 'sine', g * 0.45)),
    whoosh: (t, g) => noise(t, 0.5, 300, 3200, g * 1.6),
    fanfare: (t, g) => {
      [[523.3, 0], [659.3, 0.13], [784, 0.26]].forEach(([f, d]) => tone(t + d, f, f, 0.18, 'triangle', g * 0.7));
      [1046.5, 1318.5, 1568].forEach(f => tone(t + 0.4, f, f, 0.8, 'triangle', g * 0.45));
    },
    zap: (t, g) => { tone(t, 1900, 110, 0.28, 'sawtooth', g * 0.35); tone(t + 0.05, 2400, 300, 0.2, 'square', g * 0.15); },
    blip: (t, g) => { tone(t, 880, 880, 0.08, 'sine', g); tone(t + 0.09, 1320, 1320, 0.12, 'sine', g * 0.8); },
  };
  // `theme`: the theme of the card a design shows, whose own sound "Theme
  // sound" is then.
  // "The design's sound" is the design's own (`own`), else its Alert
  // card's theme's, else the look's.
  function play(alert, theme, own){
    let sound = alert.sound || '';
    if (sound === 'theme') sound = own || (THEMES[theme] ? THEMES[theme].sound : look.sound || THEMES[themeOf(look)].sound);
    const volume = Math.max(0, Math.min(100, Number(alert.volume == null || alert.volume === '' ? 70 : alert.volume))) / 100;
    if (!sound || !volume) return;
    try {
      const src = mediaSrc(sound);
      if (src){
        const file = new Audio(src);
        file.volume = volume;
        file.play().catch(() => {});
        fileSound = file;
        return;
      }
      if (!SOUNDS[sound]) return;
      audio = audio || new AudioContext();
      if (audio.state === 'suspended') audio.resume();
      SOUNDS[sound](audio.currentTime + 0.02, 0.6 * volume);
    } catch (_){ /* no sound is better than no alert */ }
  }

  // An alert with a design (an overlay made in the Studio) shows that
  // instead of a theme's card: loaded for this one alert, laid out on a
  // 1920 x 1080 canvas like every overlay and scaled to this page, it plays
  // its entrance, holds, and leaves its own way. Its sound plays here. A
  // design that is gone shows the theme's card, so no alert is lost.
  const DESIGN_LEAVE = 900;
  function designSrc(alert){ return '/overlay/' + encodeURIComponent(alert.design) + '.html'; }
  // In OBS the page is the canvas: a design fills it. A dashboard's preview
  // (demo) is any shape: it shows where the design's layers are (`box`, as
  // the design says when it plays) as large as fits, up to half again their
  // size, or the whole canvas until then.
  const DEMO_PAD = 28, DEMO_ZOOM = 1.5;
  function fitDesign(frame, box){
    const b = box || frame.icBox || {x:0, y:0, w:1920, h:1080};
    frame.icBox = b;
    if (!demo){
      // ?at=top (an OBS source set up as 0.1.15 said): a design laid out
      // low moves up, as far from the top as it was from the bottom.
      const up = pinnedTop && !embed && b.y > 540 ? 2 * b.y + b.h - 1080 : 0;
      frame.style.transform = 'scale(' + (innerWidth / 1920) + ') translateY(' + -up + 'px)';
      return;
    }
    const s = Math.min((innerWidth - 2 * DEMO_PAD) / b.w, (innerHeight - 2 * DEMO_PAD) / b.h, DEMO_ZOOM);
    const x = (innerWidth - b.w * s) / 2 - b.x * s, y = (innerHeight - b.h * s) / 2 - b.y * s;
    frame.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
  }
  addEventListener('resize', () => document.querySelectorAll('.design').forEach(f => fitDesign(f)));
  // A design answers an alert with its own sound and its card's theme (if
  // it has them): `shown` runs then, or a moment after it loaded when it
  // doesn't answer.
  window.addEventListener('message', e => {
    const frame = [...document.querySelectorAll('.design')].find(f => f.contentWindow === e.source);
    if (frame && frame.icShown && e.data && e.data.__ic_design) frame.icShown(e.data.__ic_design);
  });
  function design(alert, hold, shown){
    const frame = document.createElement('iframe');
    frame.className = 'design';
    frame.setAttribute('aria-hidden', 'true');
    frame.tabIndex = -1;
    fitDesign(frame);
    frame.icShown = said => {
      // Skipped or gone before it loaded: nothing to show or hear.
      if (!frame.isConnected || frame.classList.contains('skipped')) return;
      if (said.box) fitDesign(frame, said.box);
      const then = shown; shown = null; if (then) then(said);
    };
    // A saved overlay is sandboxed, with an origin of its own that has no
    // name: '*' reaches it, and it checks the message came from this app.
    frame.onload = () => {
      frame.contentWindow.postMessage({__ic_alert:{title:alert.title || '', text:alert.text || '', message:alert.message || '',
        image:mediaSrc(alert.image), color:alert.color || '', ms:hold}}, '*');
      setTimeout(() => frame.icShown({}), 1500);
    };
    frame.src = designSrc(alert);
    document.body.appendChild(frame);
    return frame;
  }
  // How long a design may take to load (its fonts and pictures, on a cold
  // start of OBS) before the next alert goes ahead.
  const DESIGN_LOAD_WAIT = 8000;
  function nextDesign(alert){
    // It leaves its own way, then goes; skipped, it fades out at once.
    let left = false;
    const gone = () => {
      if (left) return;
      left = true;
      current = null;
      document.querySelectorAll('.design').forEach(f => f.remove());
      setTimeout(next, GAP);
    };
    // Its time on screen counts from when it shows, not from when it began
    // to load: a slow load never cuts it short.
    let timer = setTimeout(gone, DESIGN_LOAD_WAIT);
    design(alert, alert.ms, said => {
      clearTimeout(timer);
      play(alert, said.theme, said.sound);
      timer = setTimeout(gone, alert.ms + DESIGN_LEAVE);
    });
    current = () => {
      clearTimeout(timer);
      document.querySelectorAll('.design').forEach(f => f.classList.add('skipped'));
      setTimeout(gone, SKIP_FADE);
    };
  }
  // End the alert on now, sound and all; the next one comes on.
  const SKIP_FADE = 250;
  function skipNow(){
    const end = current;
    current = null;
    if (fileSound){ fileSound.pause(); fileSound = null; }
    if (end) end();
  }

  function next(){
    const alert = queue.shift();
    if (!alert){ playing = false; return; }
    playing = true;
    if (!alert.design && !alert.checked && look.design) alert.design = look.design;
    if (alert.design && !alert.checked){
      fetch(designSrc(alert), {cache:'no-store'})
        .then(r => r.ok)
        .catch(() => false)
        .then(ok => {
          // A design that's gone: the default plays instead, or, gone too,
          // the theme's card.
          if (ok) alert.checked = true;
          else if (look.design && alert.design !== look.design) alert.design = look.design;
          else { alert.design = ''; alert.checked = true; }
          queue.unshift(alert); next();
        });
      return;
    }
    if (alert.design){ nextDesign(alert); return; }
    let el;
    // One alert that can't be drawn is skipped: it never stops the queue.
    try { el = card(alert); }
    catch (e){ console.error('alert skipped:', e); next(); return; }
    document.body.appendChild(el);
    // Two frames: the start state has to be painted before it can animate.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add('in');
      decode(el);
      play(alert);
      el.querySelector('.time i').animate([{transform:'scaleX(1)'}, {transform:'scaleX(0)'}],
        {duration:alert.ms, easing:'linear', fill:'forwards'});
    }));
    const timer = setTimeout(() => { current = null; leave(el, () => setTimeout(next, GAP)); }, alert.ms);
    current = () => { clearTimeout(timer); leave(el, () => setTimeout(next, GAP)); };
  }

  // OBS keeps this page open through an app update: when the app serves a
  // newer one, load it. At most once a minute, so nothing can loop.
  function reloadForUpdate(){
    try {
      const last = Number(sessionStorage.getItem('ic-alerts-reload') || 0);
      if (Date.now() - last < 60000) return;
      sessionStorage.setItem('ic-alerts-reload', String(Date.now()));
    } catch (_){ /* no storage: the fingerprint still settles it */ }
    location.reload();
  }

  function take(board){
    const list = board && Array.isArray(board.alerts) ? board.alerts : null;
    if (!list) return;
    if (board.page && board.page !== PAGE && !PAGE.startsWith('__')){ reloadForUpdate(); return; }
    applyLook(board.look);
    const top = list.reduce((m, a) => Math.max(m, a.id), 0);
    // After an app restart the ids start over.
    if (board.boot !== boot){
      // A page that was already watching keeps everything the new app
      // shows; on first load, what is already up is old news.
      if (boot !== null) seen = 0;
      boot = board.boot;
      skips = null;
    }
    // A Skip asked for since the last look ends what plays now; one from
    // before this page opened doesn't.
    const asked = Number(board.skips) || 0;
    if (skips !== null && asked > skips) skipNow();
    skips = asked;
    if (seen === null){ seen = top; return; }
    list.filter(a => a.id > seen).forEach(a => queue.push(a));
    seen = Math.max(seen, top);
    if (!playing) next();
  }

  // The dashboard's preview: one card that stays, redrawn as it's edited.
  // `replay` plays its entrance (and sound) again; `replay: 'full'` also
  // lets it leave after a moment, then it comes back to stay.
  let demoTurn = 0, demoTimer = 0;
  function showDemo(data){
    const turn = ++demoTurn;
    clearTimeout(demoTimer);
    applyLook(data.look);
    document.querySelectorAll('.card,.design').forEach(c => c.remove());
    if (!data.card) return;
    const named = data.card.design || (data.look && data.look.design);
    if (named){
      const hold = data.replay === 'full' ? DEMO_HOLD : 24 * 3600 * 1000;
      design(Object.assign({}, data.card, {design:named}), hold, data.sound ? said => play(data.card, said.theme, said.sound) : null);
      if (data.replay === 'full') demoTimer = setTimeout(() => {
        if (turn === demoTurn) showDemo({look:data.look, card:data.card});
      }, DEMO_HOLD + DESIGN_LEAVE);
      return;
    }
    const el = card(data.card);
    document.body.appendChild(el);
    if (data.sound) play(data.card);
    if (!data.replay){ el.classList.add('in', 'still'); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('in'); decode(el); }));
    if (data.replay !== 'full') return;
    demoTimer = setTimeout(() => leave(el, () => {
      if (turn === demoTurn) showDemo({look:data.look, card:data.card});
    }), DEMO_HOLD);
  }

  // An "Alert card" layer: still while its design is edited, played in, or
  // sent out, as its design (this frame's parent) says.
  let held = null, heldKey = '';
  function embedded(msg){
    applyLook(msg.look);
    if (msg.mode === 'out' || msg.mode === 'none'){
      heldKey = '';
      const el = held; held = null;
      if (el && msg.mode === 'out') leave(el, () => {}); else document.querySelectorAll('.card').forEach(c => c.remove());
      return;
    }
    // A look changed in the Studio comes alone: the card stays the same.
    const said = msg.card || (held && held.icCard) || {};
    const key = msg.mode + JSON.stringify(said) + JSON.stringify(msg.look);
    if (msg.mode === 'still' && key === heldKey && held) return;
    heldKey = key;
    document.querySelectorAll('.card').forEach(c => c.remove());
    const el = card(said);
    el.icCard = said;
    held = el;
    document.body.appendChild(el);
    if (msg.mode === 'still'){ el.classList.add('in', 'still'); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add('in');
      decode(el);
      el.querySelector('.time i').animate([{transform:'scaleX(1)'}, {transform:'scaleX(0)'}],
        {duration:msg.ms || 6000, easing:'linear', fill:'forwards'});
    }));
  }
  if (embed){
    window.addEventListener('message', e => { if (e.source === window.parent && e.data && e.data.__ic_card) embedded(e.data.__ic_card); });
    return;
  }

  if (demo){
    window.addEventListener('message', e => {
      if (e.origin === location.origin && e.data && e.data.instantcloneAlert) showDemo(e.data.instantcloneAlert);
    });
    return;
  }
  const feed = new EventSource('/alerts-events');
  feed.onmessage = e => { try { take(JSON.parse(e.data)); } catch(_){} };
})();
</script>
</body>
</html>
