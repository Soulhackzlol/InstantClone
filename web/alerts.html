<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InstantClone alerts</title>
<!--
  The alerts browser source: add http://127.0.0.1:<port>/alerts to OBS as a
  Browser source. "Show on stream" steps put a card here. Each new alert
  plays once, in order; ones already up when the page loads are skipped, so
  switching scenes never replays old alerts. ?at=top puts cards at the top.
-->
<style>
  :root{
    --bg:rgba(15,18,24,.9); --line:rgba(255,255,255,.09); --fg:#f4f6f8; --dim:#9aa4ae;
    --accent:#5ac8fa; --ease:cubic-bezier(.16,1,.3,1);
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{display:flex;justify-content:center;align-items:flex-end;padding:48px;box-sizing:border-box;
    font:16px/1.35 "Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--fg)}
  body.top{align-items:flex-start}
  .card{position:relative;max-width:min(720px,100%);padding:18px 26px 20px 30px;border-radius:18px;
    background:var(--bg);box-shadow:0 0 0 1px var(--line),0 18px 40px -12px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.3);
    overflow:hidden;opacity:0;transform:translateY(22px) scale(.96);filter:blur(6px);
    transition:opacity .52s var(--ease),transform .52s var(--ease),filter .52s var(--ease)}
  body.top .card{transform:translateY(-22px) scale(.96)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .card.in{opacity:1;transform:none;filter:none}
  .card.out{opacity:0;transform:translateY(8px) scale(.99);filter:blur(2px);
    transition-duration:.28s;transition-timing-function:cubic-bezier(.4,0,1,1)}
  .title,.text{opacity:0;transform:translateY(6px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
  .card.in .title{opacity:1;transform:none;transition-delay:.08s}
  .card.in .text{opacity:1;transform:none;transition-delay:.15s}
  .title{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .title:empty{display:none}
  .text{font-size:26px;font-weight:650;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
  .time{position:absolute;left:5px;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
  .time i{display:block;height:100%;background:var(--accent);opacity:.55;transform-origin:left;transform:scaleX(1)}
</style>
</head>
<body>
<script>
'use strict';
(function(){
  if (new URLSearchParams(location.search).get('at') === 'top') document.body.classList.add('top');
  const GAP = 250, LEAVE = 300;
  const queue = [];
  let boot = null, seen = null, playing = false;

  function card(alert){
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = '<div class="title"></div><div class="text"></div><div class="time"><i></i></div>';
    el.querySelector('.title').textContent = alert.title || '';
    el.querySelector('.text').textContent = alert.text || '';
    return el;
  }

  function next(){
    const alert = queue.shift();
    if (!alert){ playing = false; return; }
    playing = true;
    const el = card(alert);
    document.body.appendChild(el);
    // Two frames: the start state has to be painted before it can animate.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add('in');
      el.querySelector('.time i').animate([{transform:'scaleX(1)'}, {transform:'scaleX(0)'}],
        {duration:alert.ms, easing:'linear', fill:'forwards'});
    }));
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => { el.remove(); setTimeout(next, GAP); }, LEAVE);
    }, alert.ms);
  }

  function take(board){
    const list = board && Array.isArray(board.alerts) ? board.alerts : null;
    if (!list) return;
    const top = list.reduce((m, a) => Math.max(m, a.id), 0);
    // After an app restart the ids start over.
    if (board.boot !== boot){
      // A page that was already watching keeps everything the new app
      // shows; on first load, what is already up is old news.
      if (boot !== null) seen = 0;
      boot = board.boot;
    }
    if (seen === null){ seen = top; return; }
    list.filter(a => a.id > seen).forEach(a => queue.push(a));
    seen = Math.max(seen, top);
    if (!playing) next();
  }

  const feed = new EventSource('/alerts-events');
  feed.onmessage = e => { try { take(JSON.parse(e.data)); } catch(_){} };
})();
</script>
</body>
</html>
