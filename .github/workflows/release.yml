name: release

# Trigger: pushing a tag like v0.1.0 or v0.2.3.
# What it does: builds the release binary, computes its SHA-256, and
# creates a GitHub Release with the .exe + a checksum file attached.
# Auto-generated release notes come from the commit log between tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create releases

jobs:
  # Gate 1: tests must pass on the exact tagged commit before we ship.
  # This guards against the "tag a commit that was never on main" case
  # where ci.yml never ran. Same checks ci.yml does, in the same order.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --release

  # Gate 2: only runs if `test` succeeded. Builds, stages, publishes.
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build release
        run: cargo build --release

      - name: stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          $tag = "${{ github.ref_name }}"
          Copy-Item .\target\release\instantclone.exe "artifacts\instantclone-$tag-windows-x64.exe"
          $hash = (Get-FileHash "artifacts\instantclone-$tag-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  instantclone-$tag-windows-x64.exe" | Out-File -FilePath "artifacts\SHA256SUMS.txt" -Encoding ascii
          Get-ChildItem artifacts

      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # SemVer convention: anything with a `-` suffix (e.g. v0.1.0-beta.1,
          # v0.1.0-rc.2) is a pre-release. Stable tags (v0.1.0) ship as full.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/instantclone-*.exe
            artifacts/SHA256SUMS.txt
