name: release

# Trigger: pushing a tag like v0.1.0 or v0.2.3.
# What it does: builds the release binary, computes its SHA-256, and
# creates a GitHub Release with the .exe + a checksum file attached. The
# release's notes are written by hand (see "publish release").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create releases

# The Twitch app id the Integrations tab logs in with (Device Code flow, a
# public client: the id is not a secret). Baked in at compile time through
# option_env!; set it as a repository variable named TWITCH_CLIENT_ID.
#
# INSTANTCLONE_RELEASE_BUILD marks the binaries as release builds: only they
# compare their own SHA-256 with the published one to spot a new build of
# the same version (update_check.rs). A local build never matches it.
# INSTANTCLONE_BUILD_COMMIT is the commit a build came from, so an update
# can list what it brings since (the commits on top of it).
env:
  INSTANTCLONE_TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
  INSTANTCLONE_RELEASE_BUILD: "1"
  INSTANTCLONE_BUILD_COMMIT: ${{ github.sha }}

jobs:
  # Gate 1: tests must pass on the exact tagged commit before we ship.
  # This guards against the "tag a commit that was never on main" case
  # where ci.yml never ran. Same checks ci.yml does, in the same order.
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      # The tag must be the app's own version (Cargo.toml). A build that
      # says it is another version than its release would see that release
      # as newer than itself, and offer it as an update over and over.
      - name: tag matches the app version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version in Cargo.toml. Bump Cargo.toml, or tag v$version."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the app version."
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore-only: release runs on tags (rare), so populating the cache
          # buys nothing and the save step is flaky on Windows runners (tar of
          # a large release target/), which red-X'd the job after publishing.
          save-if: false
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --release

  # Linux gate: same checks on Ubuntu so we never ship a Linux binary that
  # fails clippy or tests on its own platform (the Linux-only cfg code is
  # invisible to the Windows `test` job above).
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # ffmpeg: the reconnect screen's decode tests fail on Linux CI without it
      # (same deps as ci.yml's test-linux).
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev ffmpeg
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --release

  # Builds the Linux binary and hands it to the publish job as an artifact, so
  # the single GitHub Release carries both OS builds under one SHA256SUMS.
  build-linux:
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: build release
        run: cargo build --release
      - name: stage linux binary
        run: |
          mkdir -p dist
          cp target/release/instantclone "dist/instantclone-${{ github.ref_name }}-linux-x64"
      - name: upload linux binary
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/instantclone-*-linux-x64
          retention-days: 1

  # Gate 2: only runs if BOTH platforms' tests passed and the Linux binary is
  # built. Stages every artifact, hashes them into one SHA256SUMS, publishes.
  build:
    needs: [test, build-linux]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Restore-only: release runs on tags (rare), so populating the cache
          # buys nothing and the save step is flaky on Windows runners (tar of
          # a large release target/), which red-X'd the job after publishing.
          save-if: false

      - name: build release
        run: cargo build --release

      # The Linux binary was built by build-linux; pull it in so it lands in
      # the same release under the same SHA256SUMS.
      - name: download linux binary
        uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: artifacts

      - name: stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $tag = "${{ github.ref_name }}"
          $win = "instantclone-$tag-windows-x64.exe"
          $lin = "instantclone-$tag-linux-x64"
          Copy-Item .\target\release\instantclone.exe "artifacts\$win"
          # Ship the optional VOD-unlocker OBS script under a version-less
          # name so `releases/latest/download/optional-vod-unlocker.lua`
          # always resolves for the in-app auto-downloader.
          Copy-Item .\obs\instantclone-vod-track.lua "artifacts\optional-vod-unlocker.lua"
          # One SHA256SUMS covering every published file. self_update.rs looks
          # up its line by the exact asset name, so these MUST match
          # release_asset_name() (locked by a unit test).
          $winHash = (Get-FileHash "artifacts\$win" -Algorithm SHA256).Hash.ToLower()
          $luaHash = (Get-FileHash "artifacts\optional-vod-unlocker.lua" -Algorithm SHA256).Hash.ToLower()
          "$winHash  $win" | Out-File -FilePath "artifacts\SHA256SUMS.txt" -Encoding ascii
          if (Test-Path "artifacts\$lin") {
            $linHash = (Get-FileHash "artifacts\$lin" -Algorithm SHA256).Hash.ToLower()
            "$linHash  $lin" | Out-File -FilePath "artifacts\SHA256SUMS.txt" -Encoding ascii -Append
          }
          "$luaHash  optional-vod-unlocker.lua" | Out-File -FilePath "artifacts\SHA256SUMS.txt" -Encoding ascii -Append
          Get-ChildItem artifacts

      # No generated notes: they add a "What's Changed" list of pull request
      # titles, once more every time a tag is moved to republish a build. The
      # release's notes are written by hand.
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          # SemVer convention: anything with a `-` suffix (e.g. v0.1.0-beta.1,
          # v0.1.0-rc.2) is a pre-release. Stable tags (v0.1.0) ship as full.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/instantclone-*-windows-x64.exe
            artifacts/instantclone-*-linux-x64
            artifacts/optional-vod-unlocker.lua
            artifacts/SHA256SUMS.txt

  # Sends each stable release to winget (Soulhackzlol.InstantClone) as a pull
  # request to microsoft/winget-pkgs, using Microsoft's wingetcreate, from a
  # fork owned by the token's account. A job of its own after the release is
  # out, so winget being slow or failing never holds a release back. Skipped
  # for pre-releases, which winget doesn't list, and when the WINGET_TOKEN
  # secret (a classic token with the public_repo scope) isn't set. A tag
  # moved to republish a build is sent again: winget checks the exe's hash,
  # so its listing must carry the new one.
  winget:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-2022
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: submit to winget
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/instantclone-$tag-windows-x64.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Soulhackzlol.InstantClone --version $version --urls $url --token $env:WINGET_TOKEN --submit
