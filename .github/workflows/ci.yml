name: ci

# Runs on every push to main and every PR. Cancels in-flight runs when a
# newer commit lands on the same branch so we don't queue stale builds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + clippy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches the Cargo registry, git index, and target/ between runs.
      # Without this, every push pays the full ~5 min compile cost.
      - uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      # Real clippy gate: `-D warnings` turns every lint into an error.
      # Default profile (not --release) because clippy emits the same
      # lints either way and the unoptimised compile is faster.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --release

      # Tests run in --release because runtime correctness depends on
      # `panic = "abort"`. Drop `--no-fail-fast` so the first failure is
      # the one in the log - clearer signal than a wall of stack traces.
      - name: test
        run: cargo test --release

      - name: binary size
        shell: pwsh
        run: |
          $sz = (Get-Item .\target\release\instantclone.exe).Length
          "Binary: $([Math]::Round($sz/1KB,1)) KB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: upload binary for e2e
        uses: actions/upload-artifact@v7
        with:
          name: instantclone-${{ github.sha }}
          path: target/release/instantclone.exe
          retention-days: 1

  # Real end-to-end: ffmpeg pushes a synthetic H.264 + AAC stream into
  # instantclone's ingest, instantclone forwards it to the in-tree sink,
  # the sink confirms onMetaData + publish + IDR detection. Exercises
  # handshake, AMF0, chunking, h264 classification, and the egress pump
  # against a real RTMP peer - the whole wire path the unit tests skip.
  e2e:
    name: e2e (ffmpeg → proxy → sink)
    needs: test
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: download binary
        uses: actions/download-artifact@v8
        with:
          name: instantclone-${{ github.sha }}
          path: target/release

      - name: install ffmpeg
        run: choco install ffmpeg --no-progress --yes

      - name: run e2e
        shell: pwsh
        run: .\scripts\e2e.ps1

      - name: upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.sha }}
          path: ${{ runner.temp }}/ic-e2e-*
          retention-days: 7
          if-no-files-found: ignore
