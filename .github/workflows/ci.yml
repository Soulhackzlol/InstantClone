name: ci

# Runs on every push to main and every PR. Cancels in-flight runs when a
# newer commit lands on the same branch so we don't queue stale builds.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches the Cargo registry, git index, and target/ between runs.
      # Without this, every push pays the full ~5 min compile cost.
      - uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      # Real clippy gate: `-D warnings` turns every lint into an error.
      # Default profile (not --release) because clippy emits the same
      # lints either way and the unoptimised compile is faster.
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --release

      # Tests run in --release because runtime correctness depends on
      # `panic = "abort"`. Drop `--no-fail-fast` so the first failure is
      # the one in the log — clearer signal than a wall of stack traces.
      - name: test
        run: cargo test --release

      - name: binary size
        shell: pwsh
        run: |
          $sz = (Get-Item .\target\release\instantclone.exe).Length
          "Binary: $([Math]::Round($sz/1KB,1)) KB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
