name: codeql

# Static analysis on every push/PR. Skipped while the repo is private -
# CodeQL is gated behind GitHub Advanced Security for private repos, but
# free on public ones. When the repo flips public this workflow starts
# running automatically with no edits needed.
#
# Re-add the weekly cron trigger after going public if you want CodeQL
# to pick up new rules between pushes on quiet branches:
#   schedule:
#     - cron: "23 4 * * 1"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Gate: skip on private repos (where CodeQL would 403 without GHAS).
    # Becomes a no-op until the repo is made public.
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [rust]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: init codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # CodeQL's Rust extractor watches `cargo build`. Default profile is
      # fine: clippy/security queries don't need optimised codegen.
      - name: build
        run: cargo build

      - name: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
