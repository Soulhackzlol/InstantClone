<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="880" height="196" role="img" aria-label="Three steps: Arm fills the buffer while you stay live, Activate goes delayed with zero glitch, Cut snaps back to live instantly">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="cardS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13171e"/>
      <stop offset="100%" stop-color="#0d1015"/>
    </linearGradient>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ac8fa"/>
    </marker>
    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .verb { font-family: -apple-system, Segoe UI, Inter, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.4px; }
    .num  { font-family: -apple-system, Segoe UI, Inter, sans-serif; font-weight: 700; font-size: 11px; }
    .st   { font-family: -apple-system, Segoe UI, Inter, sans-serif; font-weight: 600; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
    .cap  { font-family: -apple-system, Segoe UI, Inter, sans-serif; font-weight: 500; font-size: 11px; fill: #9aa0ad; }
  </style>

  <!-- One master cycle = 3.2s; arrows / pulses run at 1.6s so the whole
       composition realigns every loop, and each meter reset is hidden
       behind an opacity fade so nothing snaps. -->

  <rect width="880" height="196" rx="14" fill="url(#bgS)"/>

  <!-- ══ 1 · ARM · buffer fills, you stay live ═══════════════════ -->
  <g transform="translate(18, 26)" filter="url(#shadowS)">
    <rect width="248" height="144" rx="14" fill="url(#cardS)" stroke="rgba(255,159,10,0.32)"/>
    <circle cx="30" cy="32" r="12" fill="rgba(255,159,10,0.16)" stroke="rgba(255,159,10,0.5)"/>
    <text class="num" x="30" y="36" text-anchor="middle" fill="#ff9f0a">1</text>
    <text class="verb" x="52" y="38" fill="#ff9f0a">Arm</text>
    <text class="st" x="52" y="62" fill="#ff9f0a">buffering</text>

    <!-- filling meter: eases full, holds, fades out; empty fades back in -->
    <rect x="24" y="76" width="200" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
    <rect x="24" y="76" height="12" rx="6" fill="#ff9f0a">
      <animate attributeName="width" values="0;168;168" keyTimes="0;0.62;1"
               calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1"
               dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.12;0.8;1"
               dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <text class="cap" x="124" y="112" text-anchor="middle">buffer fills up</text>
    <text class="cap" x="124" y="128" text-anchor="middle" fill="#7a7d8a">you're still going out live</text>
  </g>

  <!-- arrow 1 → 2 -->
  <line x1="274" y1="98" x2="312" y2="98" stroke="#5ac8fa" stroke-width="1.6" marker-end="url(#arrS)"/>
  <circle r="2.4" fill="#5ac8fa">
    <animateMotion path="M 274 98 L 306 98" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ 2 · ACTIVATE · go delayed, zero glitch ══════════════════ -->
  <g transform="translate(316, 26)" filter="url(#shadowS)">
    <rect width="248" height="144" rx="14" fill="url(#cardS)" stroke="rgba(52,199,89,0.34)"/>
    <circle cx="30" cy="32" r="12" fill="rgba(52,199,89,0.16)" stroke="rgba(52,199,89,0.5)"/>
    <text class="num" x="30" y="36" text-anchor="middle" fill="#34c759">2</text>
    <text class="verb" x="52" y="38" fill="#34c759">Activate</text>
    <text class="st" x="52" y="62" fill="#34c759">on air &#183; delayed</text>

    <!-- full meter with delay badge -->
    <rect x="24" y="76" width="200" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
    <rect x="24" y="76" width="200" height="12" rx="6" fill="#34c759" opacity="0.9"/>
    <g transform="translate(184, 70)">
      <rect width="40" height="24" rx="12" fill="#0a0c12" stroke="rgba(52,199,89,0.6)"/>
      <text class="num" x="20" y="16" text-anchor="middle" fill="#eaf7ee">N s</text>
    </g>
    <circle cx="34" cy="82" r="4" fill="#eaffee">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <text class="cap" x="124" y="112" text-anchor="middle">you go delayed on screen</text>
    <text class="cap" x="124" y="128" text-anchor="middle" fill="#7a7d8a">instant switch, zero glitch</text>
  </g>

  <!-- arrow 2 → 3 -->
  <line x1="572" y1="98" x2="610" y2="98" stroke="#5ac8fa" stroke-width="1.6" marker-end="url(#arrS)"/>
  <circle r="2.4" fill="#5ac8fa">
    <animateMotion path="M 572 98 L 604 98" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ 3 · CUT · snap back to live ═════════════════════════════ -->
  <g transform="translate(614, 26)" filter="url(#shadowS)">
    <rect width="248" height="144" rx="14" fill="url(#cardS)" stroke="rgba(255,69,58,0.34)"/>
    <circle cx="30" cy="32" r="12" fill="rgba(255,69,58,0.16)" stroke="rgba(255,69,58,0.5)"/>
    <text class="num" x="30" y="36" text-anchor="middle" fill="#ff453a">3</text>
    <text class="verb" x="52" y="38" fill="#ff453a">Cut</text>
    <text class="st" x="52" y="62" fill="#ff453a">back to live</text>

    <!-- delay drains to zero (eased), then fades out and refills unseen -->
    <rect x="24" y="76" width="200" height="12" rx="6" fill="rgba(255,255,255,0.06)"/>
    <rect x="24" y="76" height="12" rx="6" fill="#ff453a">
      <animate attributeName="width" values="200;200;0;0" keyTimes="0;0.32;0.58;1"
               calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"
               dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.92;0.92;0;0" keyTimes="0;0.08;0.72;0.86;1"
               dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <!-- green live tick lands as the delay hits zero -->
    <circle cx="30" cy="82" r="4" fill="#34c759">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.62;0.78;0.88;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <text class="cap" x="124" y="112" text-anchor="middle">snap back to live</text>
    <text class="cap" x="124" y="128" text-anchor="middle" fill="#7a7d8a">any time, same clean switch</text>
  </g>
</svg>
