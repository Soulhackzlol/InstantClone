<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380" role="img" aria-label="InstantClone OBS dock preview">
  <defs>
    <linearGradient id="dockBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1016"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="primaryD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ac8fa"/>
      <stop offset="100%" stop-color="#42b8e8"/>
    </linearGradient>
    <linearGradient id="topShineD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmerD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dockAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#5ac8fa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5ac8fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="dockShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="ctaGlowD" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#5ac8fa" flood-opacity="0.45"/>
    </filter>
    <filter id="numGlowD" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    .h    { font-family: -apple-system, Segoe UI, Inter, sans-serif; font-weight: 700; fill: #f4f6f9; }
    .sub  { font-family: -apple-system, Segoe UI, Inter, sans-serif; font-weight: 500; fill: #7a7d8a; }
    .val  { font-family: 'JetBrains Mono', ui-monospace, monospace; fill: #f4f6f9; }
  </style>

  <!-- Soft aura behind the panel so it feels lit -->
  <ellipse cx="160" cy="180" rx="200" ry="160" fill="url(#dockAura)"/>
  <!-- Floating dock card with shadow + top highlight -->
  <rect width="320" height="380" rx="14" fill="url(#dockBg)" stroke="rgba(255,255,255,0.08)" filter="url(#dockShadow)"/>
  <rect width="320" height="40" rx="14" fill="url(#topShineD)"/>

  <!-- Status row -->
  <g transform="translate(20, 22)">
    <!-- ARMED pill — fill opacity breathes lightly so it draws the eye -->
    <rect width="68" height="22" rx="11" fill="rgba(90,200,250,0.14)" stroke="rgba(90,200,250,0.35)">
      <animate attributeName="fill" values="rgba(90,200,250,0.14);rgba(90,200,250,0.24);rgba(90,200,250,0.14)" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text class="h" font-size="10" x="34" y="15" text-anchor="middle" fill="#5ac8fa">ARMED</text>
    <!-- OBS pill — dot pulses to show "connection is live" -->
    <g transform="translate(212, 0)">
      <rect width="68" height="22" rx="11" fill="#161a21" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="11" r="3.5" fill="#34c759">
        <animate attributeName="opacity" values="1;0.45;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" cy="11" r="3.5" fill="none" stroke="#34c759" stroke-width="1.4" opacity="0.6">
        <animate attributeName="r" values="3.5;8;3.5" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text class="h" font-size="10" x="40" y="15" text-anchor="middle">OBS</text>
    </g>
  </g>

  <!-- Big readout — sits above its own soft glow halo, with a subtle
       scale-breath so even when nothing changes the dock feels alive. -->
  <g transform="translate(160, 130)" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.018;1" dur="3.6s"
                        additive="sum" repeatCount="indefinite"/>
      <text font-family="-apple-system, Segoe UI, Inter, sans-serif" font-weight="800" font-size="68" letter-spacing="-2.5" fill="#5ac8fa" opacity="0.35" filter="url(#numGlowD)">15.0</text>
      <text font-family="-apple-system, Segoe UI, Inter, sans-serif" font-weight="800" font-size="68" letter-spacing="-2.5" fill="#f4f6f9">15.0</text>
      <text class="sub" font-size="22" x="72" y="0" font-weight="500">s</text>
    </g>
  </g>

  <!-- Buffer bar — fill + shimmer sweep -->
  <g transform="translate(20, 156)">
    <clipPath id="dockBufClip"><rect width="280" height="6" rx="3"/></clipPath>
    <rect width="280" height="6" rx="3" fill="#1a1d28"/>
    <rect width="280" height="6" rx="3" fill="url(#primaryD)">
      <animate attributeName="width"
               values="0;280;280;0"
               keyTimes="0;0.55;0.9;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
    <g clip-path="url(#dockBufClip)">
      <rect width="100" height="6" fill="url(#shimmerD)">
        <animate attributeName="x" values="-100;360;360" keyTimes="0;0.65;1" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Caption -->
  <text class="sub" font-size="11" x="160" y="186" text-anchor="middle">Buffer full · ready to activate.</text>

  <!-- Input row -->
  <g transform="translate(20, 208)">
    <rect width="280" height="36" rx="9" fill="#161a21" stroke="rgba(255,255,255,0.06)"/>
    <text class="h" font-size="18" x="20" y="24" text-anchor="middle" fill="#7a7d8a">−</text>
    <text class="val" font-size="15" x="140" y="24" text-anchor="middle">15</text>
    <text class="sub" font-size="10" x="200" y="24" text-anchor="middle">s</text>
    <text class="h" font-size="18" x="260" y="24" text-anchor="middle" fill="#7a7d8a">+</text>
  </g>

  <!-- Primary action — halo + travelling highlight sweep. Width 224 so
       the row (224 + 12 gap + 44 X) fits exactly inside the 280 safe area. -->
  <g transform="translate(20, 258)">
    <clipPath id="ctaClipD"><rect width="224" height="44" rx="10"/></clipPath>
    <rect width="224" height="44" rx="10" fill="url(#primaryD)" filter="url(#ctaGlowD)"/>
    <rect width="224" height="16" rx="10" fill="url(#topShineD)"/>
    <g clip-path="url(#ctaClipD)">
      <rect width="70" height="44" fill="url(#shimmerD)" opacity="0.55">
        <animate attributeName="x" values="-70;294;294" keyTimes="0;0.65;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text class="h" font-size="13" x="112" y="28" text-anchor="middle" fill="#001220">▶  Activate</text>
    <!-- Ghost disarm — square 44×44 so it sits with the same 20 px
         right-padding the rest of the card uses (card width 320, parent
         translate +20, so usable row is 280: 224 + 12 gap + 44 = 280).
         Cross is drawn as two strokes for pixel-perfect centring. -->
    <rect x="236" width="44" height="44" rx="10" fill="transparent" stroke="rgba(255,255,255,0.12)"/>
    <g transform="translate(258, 22)" stroke="#c1c5cf" stroke-width="1.7" stroke-linecap="round">
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6"  x2="6" y2="-6"/>
    </g>
  </g>

  <text class="sub" font-size="10" x="160" y="338" text-anchor="middle">/dock — sits inside OBS as a browser-dock</text>
</svg>
