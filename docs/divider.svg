<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5ac8fa" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5ac8fa" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5ac8fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5ac8fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <line x1="0"   y1="16" x2="585" y2="16" stroke="url(#fadeL)" stroke-width="1.2"/>
  <line x1="615" y1="16" x2="1200" y2="16" stroke="url(#fadeR)" stroke-width="1.2"/>

  <!-- Soft halo + crisp core dot. Subtle breath so the page feels alive. -->
  <circle cx="600" cy="16" r="6" fill="#5ac8fa" opacity="0.55" filter="url(#dotGlow)">
    <animate attributeName="opacity" values="0.55;0.85;0.55" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="16" r="2.5" fill="#5ac8fa">
    <animate attributeName="r" values="2.5;3;2.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>
